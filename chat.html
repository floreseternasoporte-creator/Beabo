let chatTypingTimer = null;
let chatTypingListener = null;
  // ── GRUPO DE CHAT ─────────────────────────────────────────────────────────
  let groupChatSelectedUsers = [];

  function openCreateGroupChatView() {
    groupChatSelectedUsers = [];
    const nameInput = document.getElementById('group-chat-name-input');
    const searchInput = document.getElementById('group-chat-search-input');
    const results = document.getElementById('group-chat-search-results');
    const selectedList = document.getElementById('group-chat-selected-list');
    const selectedWrap = document.getElementById('group-chat-selected-wrap');
    if (nameInput) nameInput.value = '';
    if (searchInput) searchInput.value = '';
    if (results) results.innerHTML = '';
    if (selectedList) selectedList.innerHTML = '';
    if (selectedWrap) selectedWrap.classList.add('hidden');
    document.getElementById('create-group-chat-view')?.classList.remove('hidden');
  }

  function closeCreateGroupChatView() {
    document.getElementById('create-group-chat-view')?.classList.add('hidden');
  }

  function searchUsersForGroupChat(query) {
    const results = document.getElementById('group-chat-search-results');
    if (!results) return;
    if (!query || query.trim().length < 2) { results.innerHTML = ''; return; }
    const q = query.toLowerCase().trim();
    results.innerHTML = '<div class="text-sm text-[#8d7d75] py-2 px-1">Buscando...</div>';
    firebase.database().ref('users').orderByChild('username').startAt(q).endAt(q + '\uf8ff').limitToFirst(20).once('value').then(snap => {
      const data = snap.val() || {};
      const users = Object.entries(data).map(([uid, u]) => ({ uid, name: u.username || u.displayName || 'Usuario', image: u.profileImage || 'https://via.placeholder.com/80' }));
      const me = firebase.auth().currentUser;
      const filtered = users.filter(u => u.uid !== (me?.uid));
      results.innerHTML = '';
      if (!filtered.length) { results.innerHTML = '<div class="text-sm text-[#8d7d75] py-2 px-1">Sin resultados</div>'; return; }
      filtered.forEach(u => {
        const alreadySelected = groupChatSelectedUsers.some(s => s.uid === u.uid);
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'w-full flex items-center gap-3 bg-white border border-[#e8e1dc] rounded-2xl px-4 py-3 text-left transition active:bg-[#f5f0ed]';
        item.innerHTML = `<img src="${u.image}" class="w-10 h-10 rounded-full object-cover border border-[#e8e1dc]" alt="${u.name}"><span class="font-semibold text-[#2f1a14] flex-1">${u.name}</span>${alreadySelected ? '<span class="text-xs text-[#8d7d75]">Agregado</span>' : '<span class="text-xs font-semibold text-[#2f1a14] bg-[#f1ece9] px-3 py-1 rounded-full">Agregar</span>'}`;
        if (!alreadySelected) {
          item.onclick = () => addUserToGroupChat(u);
        }
        results.appendChild(item);
      });
    }).catch(() => { results.innerHTML = '<div class="text-sm text-[#8d7d75] py-2 px-1">Error al buscar.</div>'; });
  }

  function addUserToGroupChat(user) {
    if (groupChatSelectedUsers.some(u => u.uid === user.uid)) return;
    groupChatSelectedUsers.push(user);
    renderGroupChatSelectedUsers();
    const searchInput = document.getElementById('group-chat-search-input');
    if (searchInput) { searchInput.value = ''; }
    document.getElementById('group-chat-search-results').innerHTML = '';
  }

  function removeUserFromGroupChat(uid) {
    groupChatSelectedUsers = groupChatSelectedUsers.filter(u => u.uid !== uid);
    renderGroupChatSelectedUsers();
  }

  function renderGroupChatSelectedUsers() {
    const list = document.getElementById('group-chat-selected-list');
    const wrap = document.getElementById('group-chat-selected-wrap');
    if (!list || !wrap) return;
    if (!groupChatSelectedUsers.length) { wrap.classList.add('hidden'); return; }
    wrap.classList.remove('hidden');
    list.innerHTML = '';
    groupChatSelectedUsers.forEach(u => {
      const chip = document.createElement('div');
      chip.className = 'flex items-center gap-1.5 bg-white border border-[#e8e1dc] rounded-full pl-1 pr-2.5 py-1 text-sm font-semibold text-[#2f1a14]';
      chip.innerHTML = `<img src="${u.image}" class="w-6 h-6 rounded-full object-cover" alt="${u.name}"><span>${u.name}</span><button type="button" onclick="removeUserFromGroupChat('${u.uid}')" class="ml-1 text-[#9f918a] hover:text-[#5f4b44]">×</button>`;
      list.appendChild(chip);
    });
  }

  async function createGroupChat() {
    const user = firebase.auth().currentUser;
    if (!user) return;
    const nameInput = document.getElementById('group-chat-name-input');
    const groupName = nameInput?.value.trim();
    if (!groupName) { showMiniToast('Ponle un nombre al grupo'); return; }
    if (groupChatSelectedUsers.length < 1) { showMiniToast('Agrega al menos una persona'); return; }
    const btn = document.getElementById('create-group-chat-btn');
    if (btn) btn.disabled = true;
    try {
      const groupId = firebase.database().ref('groupChats').push().key;
      const members = { [user.uid]: true };
      groupChatSelectedUsers.forEach(u => { members[u.uid] = true; });
      await firebase.database().ref('groupChats/' + groupId).set({
        name: groupName,
        createdBy: user.uid,
        createdAt: firebase.database.ServerValue.TIMESTAMP,
        members
      });
      showMiniToast('Grupo creado');
      closeCreateGroupChatView();
      openChatInboxView();
    } catch (e) {
      showMiniToast('Error al crear grupo');
      if (btn) btn.disabled = false;
    }
  }
  // ── FIN GRUPO DE CHAT ────────────────────────────────────────────────────

  function getDirectConversationId(uidA, uidB) {
    return [uidA, uidB].sort().join('__');
  }

  function openChatInboxView() {
    const user = firebase.auth().currentUser;
    if (!user) return;
    document.getElementById('main-app')?.classList.add('hidden');
    document.getElementById('groups-view')?.classList.add('hidden');
    document.getElementById('profile-view')?.classList.add('hidden');
    document.getElementById('community-view')?.classList.add('hidden');
    document.getElementById('creator-hub-view')?.classList.add('hidden');
    document.getElementById('search-view')?.classList.add('hidden');
    document.getElementById('new-chat-view')?.classList.add('hidden');
    document.getElementById('chat-room-view')?.classList.add('hidden');
    document.getElementById('chat-inbox-view')?.classList.remove('hidden');
    if (typeof window.setActiveNavTab === 'function') window.setActiveNavTab(2);
    loadChatInboxHeader();
    loadChatConversations();
  }

  function loadChatInboxHeader() {
    const user = firebase.auth().currentUser;
    if (!user) return;
    firebase.database().ref('users/' + user.uid).once('value').then(snapshot => {
      const userData = snapshot.val() || {};
      const avatar = userData.profileImage || 'https://via.placeholder.com/80';
      const avatarEl = document.getElementById('chat-inbox-profile-avatar');
      if (avatarEl) avatarEl.src = avatar;
    }).catch(() => {});
  }

  function loadChatConversations() {
    const user = firebase.auth().currentUser;
    const container = document.getElementById('chat-conversations-list');
    if (!user || !container) return;
    const now = Date.now();
    if (!chatConversationCache.items.length) {
      try {
        const raw = localStorage.getItem(CHAT_CONVERSATIONS_CACHE_KEY);
        const persisted = JSON.parse(raw || '{}');
        if (Array.isArray(persisted.items) && (now - Number(persisted.loadedAt || 0)) < CHAT_CACHE_TTL_MS) {
          chatConversationCache = { items: persisted.items, loadedAt: Number(persisted.loadedAt || 0) };
        }
      } catch (_) {}
    }
    if (chatConversationCache.items.length && (now - chatConversationCache.loadedAt) < CHAT_CACHE_TTL_MS) {
      allChatConversations = chatConversationCache.items.slice();
      renderChatConversations(allChatConversations);
      return;
    }

    container.innerHTML = `<div class="py-6 text-center">${getFadingCircleLoaderMarkup()}</div>`;
    allChatConversations = [];

    firebase.database().ref('userConversations/' + user.uid).once('value').then(async snap => {
      const map = snap.val() || {};
      const entries = Object.keys(map);
      if (!entries.length) {
        container.innerHTML = '<div class="bg-white border border-[#e8e1dc] rounded-2xl p-5 text-center text-[#8d7d75]">Aún no tienes chats. Toca el botón de escribir para iniciar uno.</div>';
        chatConversationCache = { items: [], loadedAt: Date.now() };
        return;
      }

      const conversations = await Promise.all(entries.map(async convoId => {
        const raw = map[convoId];
        const meta = (raw && typeof raw === 'object') ? raw : {};
        let otherUid = meta.otherUid || null;
        let updatedAt = Number(meta.updatedAt || 0);
        let lastMessage = meta.lastMessage || 'Sin mensajes aún';

        // Compatibilidad con datos viejos (valor boolean) y conversación sin metadatos
        if (!otherUid || !updatedAt) {
          const convoSnap = await firebase.database().ref('conversations/' + convoId).once('value');
          const convo = convoSnap.val() || {};
          const participantIds = Object.keys(convo.participants || {}).filter(uid => uid !== user.uid);
          if (!participantIds.length) return null;
          otherUid = participantIds[0];
          updatedAt = Number(convo.updatedAt || 0);
          lastMessage = convo.lastMessage || lastMessage;
        }

        const other = await getChatUserProfile(otherUid);
        return {
          id: convoId,
          otherUid,
          otherName: other.name || 'Usuario',
          otherImage: other.image || 'https://via.placeholder.com/80',
          updatedAt,
          lastMessage
        };
      }));

      allChatConversations = conversations.filter(Boolean).sort((a, b) => b.updatedAt - a.updatedAt);
      chatConversationCache = { items: allChatConversations.slice(), loadedAt: Date.now() };
      try { localStorage.setItem(CHAT_CONVERSATIONS_CACHE_KEY, JSON.stringify(chatConversationCache)); } catch (_) {}
      renderChatConversations(allChatConversations);
    }).catch(() => {
      container.innerHTML = '<div class="bg-white border border-[#e8e1dc] rounded-2xl p-5 text-center text-[#8d7d75]">No pudimos cargar tus chats.</div>';
    });
  }

  async function getChatUserProfile(uid) {
    const cached = chatUsersIndexCache.find(item => item.uid === uid);
    if (cached) return cached;
    const snap = await firebase.database().ref('users/' + uid).once('value');
    const data = snap.val() || {};
    const profile = {
      uid,
      name: data.username || data.displayName || data.email || 'Usuario',
      image: data.profileImage || 'https://via.placeholder.com/80'
    };
    chatUsersIndexCache.push(profile);
    return profile;
  }

  function ensureChatUsersIndex() {
    const user = firebase.auth().currentUser;
    if (!user) return Promise.resolve([]);
    const now = Date.now();
    if (!chatUsersIndexCache.length) {
      try {
        const raw = localStorage.getItem(CHAT_USERS_CACHE_KEY);
        const persisted = JSON.parse(raw || '{}');
        if (Array.isArray(persisted.items) && (now - Number(persisted.loadedAt || 0)) < CHAT_USERS_CACHE_TTL_MS) {
          chatUsersIndexCache = persisted.items;
          chatUsersIndexLoadedAt = Number(persisted.loadedAt || 0);
        }
      } catch (_) {}
    }
    if (chatUsersIndexCache.length && (now - chatUsersIndexLoadedAt) < CHAT_USERS_CACHE_TTL_MS) {
      return Promise.resolve(chatUsersIndexCache);
    }
    return firebase.database().ref('users').limitToFirst(CHAT_USERS_INDEX_LIMIT).once('value').then(snapshot => {
      const users = [];
      snapshot.forEach(child => {
        if (child.key === user.uid) return;
        const data = child.val() || {};
        users.push({
          uid: child.key,
          name: data.username || data.displayName || data.email || 'Usuario',
          image: data.profileImage || 'https://via.placeholder.com/80',
          normalizedName: (data.username || data.displayName || data.email || '').toLowerCase()
        });
      });
      chatUsersIndexCache = users;
      chatUsersIndexLoadedAt = Date.now();
      try {
        localStorage.setItem(CHAT_USERS_CACHE_KEY, JSON.stringify({
          items: users,
          loadedAt: chatUsersIndexLoadedAt
        }));
      } catch (_) {}
      return users;
    }).catch(() => []);
  }

  function formatConvTime(ts) {
    if (!ts) return '';
    const d = new Date(Number(ts));
    const now = new Date();
    const diffMs = now - d;
    const diffMins = Math.floor(diffMs / 60000);
    if (diffMins < 1) return 'Ahora';
    if (diffMins < 60) return `${diffMins}m`;
    const diffHours = Math.floor(diffMins / 60);
    if (diffHours < 24) return `${diffHours}h`;
    const diffDays = Math.floor(diffHours / 24);
    if (diffDays < 7) return `${diffDays}d`;
    return d.toLocaleDateString([], { day: '2-digit', month: 'short' });
  }

  function renderChatConversations(items) {
    const container = document.getElementById('chat-conversations-list');
    if (!container) return;
    if (!items.length) {
      container.innerHTML = `
        <div class="flex flex-col items-center justify-center py-16 px-4 text-center">
          <div class="w-16 h-16 rounded-full bg-[#f1ece9] flex items-center justify-center mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-[#c4b5ae]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <p class="font-black text-[#2f1a14] text-lg">Sin conversaciones aún</p>
          <p class="text-sm text-[#8d7d75] mt-1">Inicia un chat con alguien usando el botón de arriba.</p>
        </div>`;
      return;
    }
    container.innerHTML = items.map(item => {
      const timeStr = formatConvTime(item.updatedAt);
      const preview = item.lastMessage && item.lastMessage !== 'Nueva conversación' ? escapeHtml(item.lastMessage) : '<span class="italic">Nueva conversación</span>';
      return `
        <button onclick="openChatRoomFromInbox('${item.otherUid}')" class="w-full text-left bg-white border border-[#e8e1dc] rounded-2xl p-3 active:scale-[0.99] transition hover:bg-[#faf8f7]">
          <div class="flex items-center gap-3">
            <div class="relative shrink-0">
              <img src="${item.otherImage}" class="w-12 h-12 rounded-full object-cover border border-[#ece5e1]" alt="${escapeHtml(item.otherName)}">
            </div>
            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between gap-2">
                <p class="font-black text-[#2f1a14] truncate">${escapeHtml(item.otherName)}</p>
                ${timeStr ? `<span class="text-[11px] text-[#b4a9a4] shrink-0">${timeStr}</span>` : ''}
              </div>
              <p class="text-sm text-[#8d7d75] truncate mt-0.5">${preview}</p>
            </div>
          </div>
        </button>
      `;
    }).join('');
  }

  function filterChatConversations() {
    const query = (document.getElementById('chat-search-input')?.value || '').trim().toLowerCase();
    if (!query) {
      renderChatConversations(allChatConversations);
      return;
    }
    const filtered = allChatConversations.filter(item =>
      (item.otherName || '').toLowerCase().includes(query) ||
      (item.lastMessage || '').toLowerCase().includes(query)
    );
    renderChatConversations(filtered);
  }

  function openNewChatView() {
    document.getElementById('chat-inbox-view')?.classList.add('hidden');
    document.getElementById('new-chat-view')?.classList.remove('hidden');
    const input = document.getElementById('new-chat-search-input');
    if (input) {
      input.value = '';
      input.focus();
    }
    const list = document.getElementById('new-chat-results');
    if (list) {
      list.innerHTML = '<div class="bg-white border border-[#e8e1dc] rounded-2xl p-5 text-center text-[#8d7d75]">Escribe para buscar usuarios.</div>';
    }
  }

  function closeNewChatView() {
    document.getElementById('new-chat-view')?.classList.add('hidden');
    document.getElementById('chat-inbox-view')?.classList.remove('hidden');
  }

  function searchUsersForNewChat(rawQuery) {
    const query = (rawQuery || '').trim().toLowerCase();
    const list = document.getElementById('new-chat-results');
    if (!list) return;

    if (chatSearchDebounceTimer) {
      clearTimeout(chatSearchDebounceTimer);
      chatSearchDebounceTimer = null;
    }

    if (!query) {
      list.innerHTML = '<div class="bg-white border border-[#e8e1dc] rounded-2xl p-5 text-center text-[#8d7d75]">Escribe para buscar usuarios.</div>';
      return;
    }

    list.innerHTML = `<div class="py-4 text-center text-[#8d7d75] text-sm">Buscando...</div>`;
    chatSearchDebounceTimer = setTimeout(() => {
      ensureChatUsersIndex().then(usersIndex => {
      const users = usersIndex.filter(item => (item.normalizedName || '').includes(query));
      if (!users.length) {
        list.innerHTML = '<div class="bg-white border border-[#e8e1dc] rounded-2xl p-5 text-center text-[#8d7d75]">No encontramos usuarios.</div>';
        return;
      }
      list.innerHTML = users.slice(0, 30).map((item, index) => `
        <button onclick="openChatFromUserSelection('${item.uid}')" class="w-full text-left bg-white border border-[#e8e1dc] rounded-2xl p-3 transition animate-pulse" style="animation-delay:${index * 0.03}s;animation-duration:0.7s;">
          <div class="flex items-center gap-3">
            <img src="${item.image}" class="w-12 h-12 rounded-full object-cover border border-[#ece5e1]" alt="${escapeHtml(item.name)}">
            <p class="font-black text-[#2f1a14] truncate">${escapeHtml(item.name)}</p>
          </div>
        </button>
      `).join('');
      setTimeout(() => {
        list.querySelectorAll('.animate-pulse').forEach(node => node.classList.remove('animate-pulse'));
      }, 800);
      }).catch(() => {
        list.innerHTML = '<div class="bg-white border border-[#e8e1dc] rounded-2xl p-5 text-center text-[#8d7d75]">No pudimos buscar usuarios por ahora.</div>';
      });
    }, 220);
  }

  function openChatFromUserSelection(uid) {
    closeNewChatView();
    openChatRoomFromInbox(uid);
  }

  function openChatRoomFromInbox(otherUid) {
    const user = firebase.auth().currentUser;
    if (!user || !otherUid) return;
    currentChatRoomId = getDirectConversationId(user.uid, otherUid);
    currentChatRecipient = otherUid;
    chatPhotoAttachment = null;
    clearChatPhotoAttachment();
    document.getElementById('chat-inbox-view')?.classList.add('hidden');
    document.getElementById('new-chat-view')?.classList.add('hidden');
    document.getElementById('chat-room-view')?.classList.remove('hidden');
    loadChatRoomHeader(otherUid);
    ensureConversationExists(user.uid, otherUid).then(() => {
      subscribeChatTemporarySettings(currentChatRoomId);
      subscribeChatMessages(currentChatRoomId);
      subscribeChatTyping(currentChatRoomId);
      setupChatTemporaryPullGesture();
      document.getElementById('chat-room-input')?.focus();
    });
  }

  function closeChatRoomView() {
    detachChatMessagesListener();
    detachChatTemporarySettingsListener();
    currentChatRoomId = null;
    currentChatRecipient = null;
    chatTemporaryUntil = 0;
    updateChatTemporaryUI();
    chatPhotoAttachment = null;
    clearChatPhotoAttachment();
    stopChatTyping();
    detachChatTypingListener();
    detachAllMsgReactionListeners();
    hideChatReactionPicker();
    clearChatReply();
    document.getElementById('chat-room-view')?.classList.add('hidden');
    document.getElementById('chat-inbox-view')?.classList.remove('hidden');
    loadChatConversations();
  }

  function loadChatRoomHeader(otherUid) {
    const img = document.getElementById('chat-room-user-image');
    const name = document.getElementById('chat-room-username');
    if (img) img.src = 'https://via.placeholder.com/80';
    if (name) name.textContent = 'Cargando...';
    firebase.database().ref('users/' + otherUid).once('value').then(snapshot => {
      const data = snapshot.val() || {};
      if (img) img.src = data.profileImage || 'https://via.placeholder.com/80';
      if (name) name.textContent = data.username || data.displayName || data.email || 'Usuario';
    }).catch(() => {
      if (name) name.textContent = 'Usuario';
    });
  }

  function updateChatTemporaryUI() {
    const pill = document.getElementById('chat-temporary-pill');
    const indicator = document.getElementById('chat-room-temporary-pull-indicator');
    const active = chatTemporaryUntil > Date.now();
    if (!pill) return;
    if (active && indicator) indicator.classList.add('hidden');
    pill.classList.toggle('hidden', !active);
    if (active) {
      const hoursLeft = Math.max(1, Math.ceil((chatTemporaryUntil - Date.now()) / (60 * 60 * 1000)));
      pill.textContent = `Temporal · ${hoursLeft}h`;
    } else {
      pill.textContent = 'Temporal · 24h';
    }
  }

  function detachChatTemporarySettingsListener() {
    if (chatTemporarySettingsListener?.ref && chatTemporarySettingsListener?.callback) {
      chatTemporarySettingsListener.ref.off('value', chatTemporarySettingsListener.callback);
    }
    chatTemporarySettingsListener = null;
  }

  function subscribeChatTemporarySettings(conversationId) {
    detachChatTemporarySettingsListener();
    const ref = firebase.database().ref('conversationSettings/' + conversationId + '/temporaryUntil');
    const callback = snapshot => {
      chatTemporaryUntil = Number(snapshot.val() || 0);
      updateChatTemporaryUI();
    };
    ref.on('value', callback);
    chatTemporarySettingsListener = { ref, callback };
  }

  function activateTemporaryChatMode() {
    const user = firebase.auth().currentUser;
    if (!user || !currentChatRoomId) return;
    const temporaryUntil = Date.now() + CHAT_TEMPORARY_DURATION_MS;
    firebase.database().ref('conversationSettings/' + currentChatRoomId).update({
      temporaryUntil,
      activatedBy: user.uid,
      activatedAt: Date.now()
    }).then(() => {
      chatTemporaryUntil = temporaryUntil;
      updateChatTemporaryUI();
      showSaveSuccessAnimation();
    }).catch(() => {});
  }

  function ensureConversationExists(uidA, uidB) {
    const conversationId = getDirectConversationId(uidA, uidB);
    const convoRef = firebase.database().ref('conversations/' + conversationId);
    return convoRef.once('value').then(snapshot => {
      if (!snapshot.exists()) {
        return convoRef.set({
          participants: { [uidA]: true, [uidB]: true },
          createdAt: Date.now(),
          updatedAt: Date.now(),
          lastMessage: 'Nueva conversación'
        });
      }
      return null;
    }).then(() => {
      const updates = {};
      const updatedAt = Date.now();
      updates['userConversations/' + uidA + '/' + conversationId] = {
        otherUid: uidB,
        updatedAt,
        lastMessage: 'Nueva conversación'
      };
      updates['userConversations/' + uidB + '/' + conversationId] = {
        otherUid: uidA,
        updatedAt,
        lastMessage: 'Nueva conversación'
      };
      return firebase.database().ref().update(updates);
    });
  }

  function detachChatMessagesListener() {
    if (chatMessagesListener?.ref && chatMessagesListener?.callback) {
      chatMessagesListener.ref.off('child_added', chatMessagesListener.callback);
    }
    chatMessagesListener = null;
  }

  function subscribeChatMessages(conversationId) {
    detachChatMessagesListener();
    const container = document.getElementById('chat-room-messages');
    if (!container) return;
    container.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'text-center text-[#8d7d75] text-sm py-8';
    empty.id = 'chat-room-empty-state';
    empty.textContent = 'Comienza la conversación enviando un mensaje.';
    container.appendChild(empty);

    const formatMsgTime = ts => {
      if (!ts) return '';
      const d = new Date(Number(ts));
      const now = new Date();
      const isToday = d.toDateString() === now.toDateString();
      if (isToday) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleDateString([], { day: '2-digit', month: 'short' }) + ' · ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    };

    const renderMessageNode = (msg, msgId) => {
      if (msg.expiresAt && Number(msg.expiresAt) <= Date.now()) return;
      const currentUserId = firebase.auth().currentUser?.uid || '';
      const mine = msg.senderId === currentUserId;
      const resolvedId = msgId || msg.id || '';
      const content = msg.image
        ? `<img src="${msg.image}" class="max-w-[220px] rounded-2xl border border-[#e8e1dc]" alt="Foto enviada">`
        : `<p class="text-sm break-words">${escapeHtml(msg.text || '')}</p>`;
      const timeStr = formatMsgTime(msg.timestamp);

      const replyBlock = msg.replyTo
        ? `<div class="mb-2 pl-2 border-l-2 ${mine ? 'border-white/40' : 'border-[#2f1a14]/30'} opacity-80">
            <p class="text-[10px] font-bold mb-0.5 ${mine ? 'text-white/70' : 'text-[#5f4b44]'}">${escapeHtml(msg.replyTo.senderName || 'Mensaje')}</p>
            <p class="text-xs truncate ${mine ? 'text-white/60' : 'text-[#8d7d75]'}">${msg.replyTo.image ? '📷 Foto' : escapeHtml(msg.replyTo.text || '')}</p>
           </div>`
        : '';

      const wrapper = document.createElement('div');
      wrapper.className = `w-full flex flex-col ${mine ? 'items-end' : 'items-start'}`;
      if (resolvedId) wrapper.dataset.msgId = resolvedId;
      wrapper.innerHTML = `
        <div class="msg-bubble ${mine ? 'bg-[#2f1a14] text-white' : 'bg-white text-[#2f1a14] border border-[#e8e1dc]'} rounded-2xl px-4 py-2 max-w-[80%] select-none cursor-pointer" data-msg-id="${resolvedId}">
          ${replyBlock}${content}
        </div>
        <div class="msg-reactions flex gap-1 mt-0.5 px-1 flex-wrap ${mine ? 'justify-end' : 'justify-start'}" id="reactions-${resolvedId}"></div>
        ${timeStr ? `<span class="text-[10px] text-[#b4a9a4] px-1">${timeStr}</span>` : ''}
      `;
      const bubble = wrapper.querySelector('.msg-bubble');
      if (bubble && resolvedId) {
        let pressTimer = null;
        const openPicker = e => {
          e.preventDefault();
          const rect = bubble.getBoundingClientRect();
          showChatReactionPicker(resolvedId, rect, mine);
        };
        bubble.addEventListener('touchstart', () => { pressTimer = setTimeout(() => openPicker({ preventDefault: () => {} }), 500); }, { passive: true });
        bubble.addEventListener('touchend', () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });
        bubble.addEventListener('touchmove', () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });
        bubble.addEventListener('dblclick', openPicker);
      }
      if (resolvedId) subscribeMsgReactions(conversationId, resolvedId);
      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
    };

    const cachedMessages = chatMessagesMemoryCache.get(conversationId) || [];
    if (cachedMessages.length) {
      const emptyState = document.getElementById('chat-room-empty-state');
      if (emptyState) emptyState.remove();
      cachedMessages.forEach(item => renderMessageNode(item, item.id));
    }

    const ref = firebase.database().ref('conversationMessages/' + conversationId).limitToLast(CHAT_MESSAGES_LIMIT);
    const callback = snapshot => {
      const emptyState = document.getElementById('chat-room-empty-state');
      if (emptyState) emptyState.remove();
      const msg = snapshot.val() || {};
      const msgId = snapshot.key || '';
      if (!msgId) return;
      if (msg.expiresAt && Number(msg.expiresAt) <= Date.now()) return;
      const currentCache = chatMessagesMemoryCache.get(conversationId) || [];
      if (currentCache.some(item => item.id === msgId)) return;
      const nextCache = [...currentCache, { id: msgId, ...msg }].slice(-CHAT_MESSAGES_LIMIT);
      chatMessagesMemoryCache.set(conversationId, nextCache);
      renderMessageNode(msg, msgId);
    };
    ref.on('child_added', callback);
    chatMessagesListener = { ref, callback };
  }

  function setupChatTemporaryPullGesture() {
    const container = document.getElementById('chat-room-messages');
    const indicator = document.getElementById('chat-room-temporary-pull-indicator');
    const bubble = document.getElementById('chat-room-temporary-bubble');
    const text = document.getElementById('chat-room-temporary-text');
    if (!container || !indicator || !bubble || !text || container.dataset.tempPullBound === 'true') return;
    container.dataset.tempPullBound = 'true';

    const updateBubble = (distance = 0) => {
      const progress = Math.max(0, Math.min(1, distance / CHAT_TEMP_PULL_TRIGGER_PX));
      const size = 18 + Math.round(progress * 16);
      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;
      bubble.style.opacity = `${0.35 + (progress * 0.65)}`;
      bubble.style.transform = `translateY(${Math.min(34, distance * 0.35)}px) scale(${0.88 + progress * 0.35})`;
      bubble.style.boxShadow = `0 ${Math.round(6 + progress * 6)}px ${Math.round(18 + progress * 10)}px rgba(47,26,20,${0.18 + progress * 0.18})`;
      text.textContent = progress >= 1 ? 'Suelta para activar · 24h' : 'Desliza para activar chat temporal';
      text.style.opacity = `${0.7 + progress * 0.3}`;
    };

    const resetPull = () => {
      indicator.classList.add('hidden');
      updateBubble(0);
      text.textContent = 'Desliza para activar chat temporal';
      chatTemporaryPullState = { startY: 0, pulling: false, triggered: false };
    };

    const onStart = y => {
      if (container.scrollTop > 0 || chatTemporaryUntil > Date.now()) return;
      chatTemporaryPullState.startY = y;
      chatTemporaryPullState.pulling = true;
      chatTemporaryPullState.triggered = false;
    };

    const onMove = (y, rawEvent = null) => {
      if (!chatTemporaryPullState.pulling) return;
      const distance = Math.max(0, y - chatTemporaryPullState.startY);
      if (distance <= 0) return;
      if (rawEvent?.cancelable) rawEvent.preventDefault();
      indicator.classList.remove('hidden');
      updateBubble(distance);
      if (distance >= CHAT_TEMP_PULL_TRIGGER_PX) {
        chatTemporaryPullState.triggered = true;
      }
    };

    const onEnd = () => {
      if (chatTemporaryPullState.pulling && chatTemporaryPullState.triggered) {
        bubble.animate(
          [
            { transform: bubble.style.transform || 'translateY(0) scale(1)' },
            { transform: 'translateY(10px) scale(1.25)' },
            { transform: 'translateY(0) scale(1)' }
          ],
          { duration: 260, easing: 'ease-out' }
        );
        activateTemporaryChatMode();
      }
      resetPull();
    };

    container.addEventListener('touchstart', e => onStart(e.touches?.[0]?.clientY || 0), { passive: true });
    container.addEventListener('touchmove', e => onMove(e.touches?.[0]?.clientY || 0, e), { passive: false });
    container.addEventListener('touchend', onEnd);
    container.addEventListener('mousedown', e => onStart(e.clientY));
    container.addEventListener('mousemove', e => onMove(e.clientY, e));
    container.addEventListener('mouseup', onEnd);
    container.addEventListener('mouseleave', onEnd);
  }

  function handleChatPhotoAttachment(event) {
    const file = event?.target?.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      chatPhotoAttachment = e.target?.result || null;
      const wrap = document.getElementById('chat-photo-preview-wrap');
      const img = document.getElementById('chat-photo-preview-img');
      if (img) img.src = chatPhotoAttachment || '';
      if (wrap) wrap.classList.toggle('hidden', !chatPhotoAttachment);
    };
    reader.readAsDataURL(file);
  }

  function clearChatPhotoAttachment() {
    chatPhotoAttachment = null;
    const input = document.getElementById('chat-photo-input');
    const wrap = document.getElementById('chat-photo-preview-wrap');
    const img = document.getElementById('chat-photo-preview-img');
    if (input) input.value = '';
    if (img) img.src = '';
    if (wrap) wrap.classList.add('hidden');
  }

  function sendChatMessage() {
    const user = firebase.auth().currentUser;
    const input = document.getElementById('chat-room-input');
    if (!user || !input || !currentChatRoomId || !currentChatRecipient) return;
    const text = input.value.trim();
    if (!text && !chatPhotoAttachment) return;

    // Validar permisos de mensajes directos del destinatario
    firebase.database().ref('users/' + currentChatRecipient).once('value').then(snapshot => {
      const recipientData = snapshot.val() || {};
      const dmPermission = recipientData.dmPermission || 'all';
      
      // Verificar si el usuario actual sigue al destinatario (amigos mutuos)
      const isFollowing = () => {
        return new Promise((resolve) => {
          firebase.database().ref('followers/' + currentChatRecipient + '/' + user.uid).once('value').then(snap => {
            resolve(snap.exists());
          });
        });
      };

      // Verificar si el destinatario sigue al usuario actual
      const isFollowedBy = () => {
        return new Promise((resolve) => {
          firebase.database().ref('followers/' + user.uid + '/' + currentChatRecipient).once('value').then(snap => {
            resolve(snap.exists());
          });
        });
      };

      // Validar permisos
      Promise.all([isFollowing(), isFollowedBy()]).then(([following, followedBy]) => {
        const areFriends = following && followedBy;

        if (dmPermission === 'none') {
          alert('Esta persona no tiene los permisos de mensaje activado.');
          return;
        }

        if (dmPermission === 'friends' && !areFriends) {
          alert('Solo los amigos pueden escribir a esta persona.');
          return;
        }

        // Si pasó todas las validaciones, enviar el mensaje
        sendChatMessageInternal();
      });
    });
  }

  function sendChatMessageInternal() {
    const user = firebase.auth().currentUser;
    const input = document.getElementById('chat-room-input');
    if (!user || !input || !currentChatRoomId || !currentChatRecipient) return;
    const text = input.value.trim();
    if (!text && !chatPhotoAttachment) return;

    const msgRef = firebase.database().ref('conversationMessages/' + currentChatRoomId).push();
    const messageId = msgRef.key;
    const sentAt = Date.now();
    const temporaryActive = chatTemporaryUntil > sentAt;
    const payload = {
      senderId: user.uid,
      text: text || '',
      image: chatPhotoAttachment || '',
      timestamp: sentAt,
      temporary: temporaryActive,
      expiresAt: temporaryActive ? (sentAt + CHAT_TEMPORARY_DURATION_MS) : null
    };
    if (chatReplyContext) {
      payload.replyTo = chatReplyContext;
    }

    // Render optimista inmediato para evitar sensación de retraso
    const currentCache = chatMessagesMemoryCache.get(currentChatRoomId) || [];
    chatMessagesMemoryCache.set(
      currentChatRoomId,
      [...currentCache, { id: messageId, ...payload }].slice(-CHAT_MESSAGES_LIMIT)
    );
    const container = document.getElementById('chat-room-messages');
    if (container) {
      const empty = document.getElementById('chat-room-empty-state');
      if (empty) empty.remove();
      const html = payload.image
        ? `<img src="${payload.image}" class="max-w-[220px] rounded-2xl border border-[#e8e1dc]" alt="Foto enviada">`
        : `<p class="text-sm break-words">${escapeHtml(payload.text || '')}</p>`;
      const replyHtml = payload.replyTo
        ? `<div class="mb-2 pl-2 border-l-2 border-white/40 opacity-80"><p class="text-[10px] font-bold mb-0.5 text-white/70">${escapeHtml(payload.replyTo.senderName || 'Mensaje')}</p><p class="text-xs truncate text-white/60">${payload.replyTo.image ? '📷 Foto' : escapeHtml(payload.replyTo.text || '')}</p></div>`
        : '';
      const wrapper = document.createElement('div');
      wrapper.className = 'w-full flex flex-col items-end';
      wrapper.innerHTML = `<div class="bg-[#2f1a14] text-white rounded-2xl px-4 py-2 max-w-[80%]">${replyHtml}${html}</div>`;
      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
    }
    clearChatReply();
    const recipientId = currentChatRecipient;
    const conversationId = currentChatRoomId;
    const lastMessage = chatPhotoAttachment ? '📷 Foto' : text;
    input.value = '';
    clearChatPhotoAttachment();
    chatConversationCache.loadedAt = 0;

    msgRef.set(payload).then(() => {
      const updates = {};
      const updatedAt = Date.now();
      updates['conversations/' + conversationId + '/lastMessage'] = lastMessage;
      updates['conversations/' + conversationId + '/lastSenderId'] = user.uid;
      updates['conversations/' + conversationId + '/updatedAt'] = updatedAt;
      updates['userConversations/' + user.uid + '/' + conversationId + '/otherUid'] = recipientId;
      updates['userConversations/' + user.uid + '/' + conversationId + '/updatedAt'] = updatedAt;
      updates['userConversations/' + user.uid + '/' + conversationId + '/lastMessage'] = lastMessage;
      updates['userConversations/' + recipientId + '/' + conversationId + '/otherUid'] = user.uid;
      updates['userConversations/' + recipientId + '/' + conversationId + '/updatedAt'] = updatedAt;
      updates['userConversations/' + recipientId + '/' + conversationId + '/lastMessage'] = lastMessage;
      return firebase.database().ref().update(updates);
    }).catch(() => {
      alert('No se pudo enviar el mensaje. Inténtalo de nuevo.');
    });
  }

  // Función auxiliar para verificar si dos usuarios son amigos (seguidores mutuos)
  function areUsersFriends(userId1, userId2) {
    return new Promise((resolve) => {
      Promise.all([
        firebase.database().ref('followers/' + userId1 + '/' + userId2).once('value'),
        firebase.database().ref('followers/' + userId2 + '/' + userId1).once('value')
      ]).then(([snap1, snap2]) => {
        resolve(snap1.exists() && snap2.exists());
      });
    });
  }

  let activeReactionMsgId = null;
  let msgReactionListeners = new Map();

  function showChatReactionPicker(msgId, rect, mine) {
    activeReactionMsgId = msgId;
    window._lastReactionMsgId = msgId;
    const picker = document.getElementById('chat-reaction-picker');
    if (!picker) return;
    const deleteRow = document.getElementById('chat-reaction-delete-row');
    if (deleteRow) deleteRow.classList.toggle('hidden', !mine);
    picker.classList.remove('hidden');
    const pickerWidth = 220;
    const pickerHeight = mine ? 126 : 88;
    let left = mine ? rect.right - pickerWidth : rect.left;
    left = Math.max(8, Math.min(left, window.innerWidth - pickerWidth - 8));
    const spaceAbove = rect.top - pickerHeight - 8;
    const top = spaceAbove >= 0 ? spaceAbove : rect.bottom + 8;
    picker.style.left = left + 'px';
    picker.style.top = Math.min(top, window.innerHeight - pickerHeight - 8) + 'px';
    picker.style.transform = 'scale(0.85)';
    picker.style.opacity = '0';
    requestAnimationFrame(() => {
      picker.style.transition = 'transform 0.18s ease, opacity 0.18s ease';
      picker.style.transform = 'scale(1)';
      picker.style.opacity = '1';
    });
    const close = e => {
      if (!picker.contains(e.target)) hideChatReactionPicker();
    };
    setTimeout(() => document.addEventListener('click', close, { once: true }), 50);
  }

  function hideChatReactionPicker() {
    const picker = document.getElementById('chat-reaction-picker');
    if (!picker) return;
    picker.style.transition = 'transform 0.14s ease, opacity 0.14s ease';
    picker.style.transform = 'scale(0.85)';
    picker.style.opacity = '0';
    setTimeout(() => picker.classList.add('hidden'), 140);
    activeReactionMsgId = null;
  }

  function submitChatReaction(emoji) {
    const msgId = activeReactionMsgId || window._lastReactionMsgId;
    hideChatReactionPicker();
    const user = firebase.auth().currentUser;
    if (!user || !msgId || !currentChatRoomId) return;
    const ref = firebase.database().ref('msgReactions/' + currentChatRoomId + '/' + msgId + '/' + user.uid);
    ref.once('value').then(snap => {
      if (snap.val() === emoji) {
        ref.remove();
      } else {
        ref.set(emoji);
      }
    }).catch(() => {});
  }

  function subscribeMsgReactions(conversationId, msgId) {
    if (!msgId || !conversationId) return;
    if (msgReactionListeners.has(msgId)) return;
    const ref = firebase.database().ref('msgReactions/' + conversationId + '/' + msgId);
    const callback = snapshot => {
      const data = snapshot.val() || {};
      renderMsgReactions(msgId, data);
    };
    ref.on('value', callback);
    msgReactionListeners.set(msgId, { ref, callback });
  }

  function detachAllMsgReactionListeners() {
    msgReactionListeners.forEach(({ ref, callback }) => {
      try { ref.off('value', callback); } catch (_) {}
    });
    msgReactionListeners.clear();
  }

  function renderMsgReactions(msgId, data) {
    const container = document.getElementById('reactions-' + msgId);
    if (!container) return;
    const counts = {};
    const currentUser = firebase.auth().currentUser?.uid || '';
    let myReaction = null;
    Object.entries(data).forEach(([uid, emoji]) => {
      counts[emoji] = (counts[emoji] || 0) + 1;
      if (uid === currentUser) myReaction = emoji;
    });
    const entries = Object.entries(counts);
    if (!entries.length) { container.innerHTML = ''; return; }
    container.innerHTML = entries.map(([emoji, count]) => {
      const active = myReaction === emoji;
      return `<button onclick="window._lastReactionMsgId='${msgId}';activeReactionMsgId='${msgId}';submitChatReaction('${emoji}')" class="inline-flex items-center gap-0.5 text-sm px-2 py-0.5 rounded-full border transition active:scale-90 ${active ? 'bg-[#f6e5dc] border-[#e4c5b2]' : 'bg-white border-[#e8e1dc]'}">${emoji}<span class="text-xs text-[#5f4b44] font-semibold">${count}</span></button>`;
    }).join('');
  }

  function triggerChatReply() {
    const msgId = activeReactionMsgId || window._lastReactionMsgId;
    hideChatReactionPicker();
    if (!msgId || !currentChatRoomId) return;
    firebase.database().ref('conversationMessages/' + currentChatRoomId + '/' + msgId).once('value').then(snap => {
      const msg = snap.val() || {};
      const user = firebase.auth().currentUser;
      const isMe = msg.senderId === user?.uid;
      let senderName = isMe ? 'Tú' : (document.getElementById('chat-room-username')?.textContent || 'Usuario');
      setChatReply({
        msgId,
        text: msg.text || '',
        image: msg.image || '',
        senderId: msg.senderId || '',
        senderName
      });
    }).catch(() => {});
  }

  function deleteChatMessage() {
    const msgId = activeReactionMsgId || window._lastReactionMsgId;
    hideChatReactionPicker();
    if (!msgId || !currentChatRoomId) return;
    const user = firebase.auth().currentUser;
    if (!user) return;
    firebase.database().ref('conversationMessages/' + currentChatRoomId + '/' + msgId).once('value').then(snap => {
      const msg = snap.val();
      if (!msg || msg.senderId !== user.uid) return;
      const wrapper = document.querySelector('[data-msg-id="' + msgId + '"]')?.closest('[class*="flex flex-col"]');
      if (wrapper) wrapper.remove();
      firebase.database().ref('conversationMessages/' + currentChatRoomId + '/' + msgId).remove();
      firebase.database().ref('msgReactions/' + currentChatRoomId + '/' + msgId).remove();
    }).catch(() => {});
  }

  function setChatReply(context) {
    chatReplyContext = context;
    const bar = document.getElementById('chat-reply-preview');
    const nameEl = document.getElementById('chat-reply-name');
    const textEl = document.getElementById('chat-reply-text');
    if (!bar || !nameEl || !textEl) return;
    nameEl.textContent = context.senderName || 'Mensaje';
    textEl.textContent = context.image ? '📷 Foto' : (context.text || '');
    bar.classList.remove('hidden');
    document.getElementById('chat-room-input')?.focus();
  }

  function clearChatReply() {
    chatReplyContext = null;
    document.getElementById('chat-reply-preview')?.classList.add('hidden');
  }

  /* ── CÁMARA ──────────────────────────────────────────────────── */
  const CAMERA_FILTERS = [
    { id: 'normal', label: 'Normal',  css: 'none',                                          thumb: '#f5f0eb' },
    { id: 'noir',   label: 'Noir',    css: 'grayscale(1) contrast(1.3)',                     thumb: '#444' },
    { id: 'fade',   label: 'Fade',    css: 'brightness(1.15) contrast(0.8) saturate(0.7)',   thumb: '#d9cfc9' },
    { id: 'cálido', label: 'Cálido',  css: 'sepia(0.35) saturate(1.5) brightness(1.05)',     thumb: '#d4935a' },
    { id: 'frío',   label: 'Frío',    css: 'hue-rotate(190deg) saturate(1.2) brightness(1.05)', thumb: '#7ab8d4' },
    { id: 'vivid',  label: 'Vívido',  css: 'saturate(2.2) contrast(1.1)',                   thumb: '#c85e9e' },
    { id: 'neon',   label: 'Neon',    css: 'hue-rotate(100deg) saturate(3) brightness(0.9) contrast(1.2)', thumb: '#3de87a' },
  ];
  let _camStream = null;
  let _camFacing = 'user';
  let _camFilterIndex = 0;
  let _camCapturedDataUrl = null;

  function _buildFilterStrip() {
    const strip = document.getElementById('chat-camera-filter-strip');
    if (!strip) return;
    strip.innerHTML = CAMERA_FILTERS.map((f, i) => {
      const sel = i === _camFilterIndex;
      return `<button onclick="selectCameraFilter(${i})" id="camfil-${i}"
        class="flex-shrink-0 flex flex-col items-center gap-1.5 active:opacity-75 transition-opacity"
        style="scroll-snap-align:center;">
        <div id="camfil-disc-${i}" style="
          width:${sel?'66px':'52px'};
          height:${sel?'66px':'52px'};
          border-radius:50%;
          background:${f.thumb};
          border:${sel?'3.5px solid #fff':'2.5px solid rgba(255,255,255,0.45)'};
          box-shadow:${sel?'0 0 0 2.5px rgba(255,255,255,0.35),0 4px 18px rgba(0,0,0,0.55)':'0 2px 6px rgba(0,0,0,0.4)'};
          transition:all 0.18s cubic-bezier(.34,1.56,.64,1);
          filter:${f.css === 'none' ? 'none' : f.css};
        "></div>
        <span id="camfil-label-${i}" style="
          color:${sel?'#fff':'rgba(255,255,255,0.6)'};
          font-size:${sel?'12px':'10.5px'};
          font-weight:${sel?'700':'500'};
          text-shadow:0 1px 5px rgba(0,0,0,0.75);
          transition:all 0.18s ease;
          letter-spacing:0.01em;
        ">${f.label}</span>
      </button>`;
    }).join('');
  }

  function selectCameraFilter(idx) {
    _camFilterIndex = idx;
    const video = document.getElementById('chat-camera-video');
    if (video) video.style.filter = CAMERA_FILTERS[idx].css;
    CAMERA_FILTERS.forEach((f, i) => {
      const disc = document.getElementById('camfil-disc-' + i);
      const label = document.getElementById('camfil-label-' + i);
      const sel = i === idx;
      if (disc) {
        disc.style.width = sel ? '66px' : '52px';
        disc.style.height = sel ? '66px' : '52px';
        disc.style.border = sel ? '3.5px solid #fff' : '2.5px solid rgba(255,255,255,0.45)';
        disc.style.boxShadow = sel
          ? '0 0 0 2.5px rgba(255,255,255,0.35),0 4px 18px rgba(0,0,0,0.55)'
          : '0 2px 6px rgba(0,0,0,0.4)';
      }
      if (label) {
        label.style.color = sel ? '#fff' : 'rgba(255,255,255,0.6)';
        label.style.fontSize = sel ? '12px' : '10.5px';
        label.style.fontWeight = sel ? '700' : '500';
      }
    });
    const strip = document.getElementById('chat-camera-filter-strip');
    const btn = document.getElementById('camfil-' + idx);
    if (strip && btn) {
      const btnCenter = btn.offsetLeft + btn.offsetWidth / 2;
      strip.scrollTo({ left: btnCenter - strip.clientWidth / 2, behavior: 'smooth' });
    }
  }

  async function openChatCamera() {
    const view = document.getElementById('chat-camera-view');
    if (!view) return;
    view.classList.remove('hidden');
    _camCapturedDataUrl = null;
    document.getElementById('chat-camera-preview-bar')?.classList.add('hidden');
    document.getElementById('chat-camera-controls')?.classList.remove('hidden');
    document.getElementById('chat-camera-canvas')?.classList.add('hidden');
    document.getElementById('chat-camera-video')?.classList.remove('hidden');
    _buildFilterStrip();
    selectCameraFilter(0);
    await _startCamStream();
  }

  async function _startCamStream() {
    if (_camStream) { _camStream.getTracks().forEach(t => t.stop()); _camStream = null; }
    try {
      _camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: _camFacing }, audio: false });
      const video = document.getElementById('chat-camera-video');
      if (video) { video.srcObject = _camStream; video.style.filter = CAMERA_FILTERS[_camFilterIndex].css; }
    } catch(e) {
      alert('No se pudo acceder a la cámara. Verifica los permisos.');
      closeChatCamera();
    }
  }

  function closeChatCamera() {
    if (_camStream) { _camStream.getTracks().forEach(t => t.stop()); _camStream = null; }
    document.getElementById('chat-camera-view')?.classList.add('hidden');
    const video = document.getElementById('chat-camera-video');
    if (video) { video.srcObject = null; video.style.filter = 'none'; }
    _camCapturedDataUrl = null;
  }

  async function flipChatCamera() {
    _camFacing = _camFacing === 'user' ? 'environment' : 'user';
    await _startCamStream();
  }

  function captureChatPhoto() {
    const video = document.getElementById('chat-camera-video');
    const canvas = document.getElementById('chat-camera-canvas');
    if (!video || !canvas) return;
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.filter = CAMERA_FILTERS[_camFilterIndex].css;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    _camCapturedDataUrl = canvas.toDataURL('image/jpeg', 0.88);
    video.classList.add('hidden');
    canvas.classList.remove('hidden');
    document.getElementById('chat-camera-controls')?.classList.add('hidden');
    document.getElementById('chat-camera-preview-bar')?.classList.remove('hidden');
  }

  function retakeChatPhoto() {
    _camCapturedDataUrl = null;
    document.getElementById('chat-camera-canvas')?.classList.add('hidden');
    document.getElementById('chat-camera-video')?.classList.remove('hidden');
    document.getElementById('chat-camera-controls')?.classList.remove('hidden');
    document.getElementById('chat-camera-preview-bar')?.classList.add('hidden');
  }

  function sendChatCameraPhoto() {
    if (!_camCapturedDataUrl) return;
    const btn = document.getElementById('cam-send-btn');
    if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; }
    chatPhotoAttachment = _camCapturedDataUrl;
    const previewImg = document.getElementById('chat-photo-preview-img');
    const previewWrap = document.getElementById('chat-photo-preview-wrap');
    if (previewImg) previewImg.src = _camCapturedDataUrl;
    if (previewWrap) previewWrap.classList.remove('hidden');
    closeChatCamera();
    setTimeout(() => sendChatMessage(), 80);
  }

  /* ── REENVÍO ─────────────────────────────────────────────────── */
  let _fwdMsgData = null;
  let _fwdAllConvs = [];

  function triggerChatForward() {
    const msgId = activeReactionMsgId || window._lastReactionMsgId;
    hideChatReactionPicker();
    if (!msgId || !currentChatRoomId) return;
    firebase.database().ref('conversationMessages/' + currentChatRoomId + '/' + msgId).once('value').then(snap => {
      _fwdMsgData = snap.val() || {};
      openChatForwardDialog();
    }).catch(() => {});
  }

  function openChatForwardDialog() {
    const dlg = document.getElementById('chat-forward-dialog');
    if (!dlg) return;
    dlg.classList.remove('hidden');
    const search = document.getElementById('chat-forward-search');
    if (search) search.value = '';
    _fwdAllConvs = [...allChatConversations];
    renderForwardList(_fwdAllConvs);
  }

  function closeChatForwardDialog() {
    document.getElementById('chat-forward-dialog')?.classList.add('hidden');
    _fwdMsgData = null;
  }

  function filterForwardList(q) {
    const lower = (q || '').toLowerCase().trim();
    const filtered = lower ? _fwdAllConvs.filter(c => (c.username || '').toLowerCase().includes(lower) || (c.displayName || '').toLowerCase().includes(lower)) : _fwdAllConvs;
    renderForwardList(filtered);
  }

  function renderForwardList(convs) {
    const list = document.getElementById('chat-forward-list');
    if (!list) return;
    if (!convs.length) { list.innerHTML = '<p class="text-center text-[#8d7d75] text-sm py-6">No hay conversaciones</p>'; return; }
    list.innerHTML = convs.map(c => {
      const name = c.displayName || c.username || 'Usuario';
      const avatar = c.photoURL ? `<img src="${c.photoURL}" class="w-11 h-11 rounded-full object-cover" alt="${name}">` : `<div class="w-11 h-11 rounded-full bg-[#e8e1dc] flex items-center justify-center text-lg font-bold text-[#5f4b44]">${name[0]?.toUpperCase()}</div>`;
      return `<button onclick="doForwardMessage('${c.convId}','${c.otherUid}')" class="w-full flex items-center gap-3 p-2.5 rounded-2xl hover:bg-[#f8f6f4] active:scale-98 transition text-left">
        ${avatar}
        <div class="min-w-0"><p class="font-bold text-[#2f1a14] text-sm truncate">${name}</p><p class="text-xs text-[#8d7d75] truncate">@${c.username || ''}</p></div>
      </button>`;
    }).join('');
  }

  async function doForwardMessage(convId, otherUid) {
    if (!_fwdMsgData) return;
    const user = firebase.auth().currentUser;
    if (!user) return;
    closeChatForwardDialog();
    let targetConvId = convId;
    if (!targetConvId) {
      const ids = [user.uid, otherUid].sort();
      targetConvId = ids[0] + '_' + ids[1];
    }
    try {
      const msgRef = firebase.database().ref('conversationMessages/' + targetConvId).push();
      const payload = { senderId: user.uid, timestamp: Date.now(), forwarded: true };
      if (_fwdMsgData.text) payload.text = _fwdMsgData.text;
      if (_fwdMsgData.image) payload.image = _fwdMsgData.image;
      await msgRef.set(payload);
      const preview = _fwdMsgData.image ? '📷 Foto' : (_fwdMsgData.text || '');
      await firebase.database().ref('conversations/' + targetConvId).update({ lastMessage: preview, lastMessageTime: Date.now(), lastMessageSenderId: user.uid });
      _fwdMsgData = null;
    } catch(e) { alert('Error al reenviar. Intenta de nuevo.'); }
  }

  function handleChatTyping() {
    const user = firebase.auth().currentUser;
    if (!user || !currentChatRoomId) return;
    firebase.database().ref('typing/' + currentChatRoomId + '/' + user.uid).set(Date.now());
    if (chatTypingTimer) clearTimeout(chatTypingTimer);
    chatTypingTimer = setTimeout(() => stopChatTyping(), 3000);
  }

  function stopChatTyping() {
    const user = firebase.auth().currentUser;
    if (!user || !currentChatRoomId) return;
    firebase.database().ref('typing/' + currentChatRoomId + '/' + user.uid).remove().catch(() => {});
    if (chatTypingTimer) { clearTimeout(chatTypingTimer); chatTypingTimer = null; }
  }

  function detachChatTypingListener() {
    if (chatTypingListener?.ref && chatTypingListener?.callback) {
      chatTypingListener.ref.off('value', chatTypingListener.callback);
    }
    chatTypingListener = null;
    const indicator = document.getElementById('chat-typing-indicator');
    if (indicator) indicator.classList.add('hidden');
  }

  function subscribeChatTyping(conversationId) {
    detachChatTypingListener();
    const user = firebase.auth().currentUser;
    if (!user || !conversationId) return;
    const ref = firebase.database().ref('typing/' + conversationId);
    const callback = snapshot => {
      const data = snapshot.val() || {};
      const now = Date.now();
      const othersTyping = Object.entries(data).filter(([uid, ts]) => uid !== user.uid && (now - Number(ts)) < 5000);
      const indicator = document.getElementById('chat-typing-indicator');
      if (!indicator) return;
      if (othersTyping.length) {
        indicator.classList.remove('hidden');
      } else {
        indicator.classList.add('hidden');
      }
    };
    ref.on('value', callback);
    chatTypingListener = { ref, callback };
  }

  function openChatRoomInfo() {
    document.getElementById('chat-room-info-panel')?.classList.remove('hidden');
  }

  function closeChatRoomInfo() {
    document.getElementById('chat-room-info-panel')?.classList.add('hidden');
  }

  function openProfileFromChatInfo() {
    closeChatRoomInfo();
    if (currentChatRecipient) openAuthorProfile(currentChatRecipient);
  }

  function clearChatConversation() {
    if (!currentChatRoomId) return;
    if (!confirm('¿Vaciar esta conversación? Los mensajes se eliminarán solo en tu vista local.')) return;
    const container = document.getElementById('chat-room-messages');
    if (container) container.innerHTML = '<div class="text-center text-[#8d7d75] text-sm py-8">Conversación vaciada.</div>';
    chatMessagesMemoryCache.delete(currentChatRoomId);
    closeChatRoomInfo();
  }

  document.addEventListener('DOMContentLoaded', () => {
    const chatInput = document.getElementById('chat-room-input');
    if (chatInput) {
      chatInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          sendChatMessage();
        }
      });
    }
  });
</script>
