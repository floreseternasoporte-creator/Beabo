<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drex Chat</title>
  <link rel="icon" href="ashhhh.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    body { font-family: 'Nunito', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#f5f4f2; }
    .hidden { display: none !important; }
    .msg-bubble { touch-action: manipulation; }
    #chat-room-messages { -webkit-overflow-scrolling: touch; }
    #chat-camera-filter-strip::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-[#f5f4f2] text-[#2f1a14] min-h-screen">
  <div id="auth-view" class="fixed inset-0 z-[100] bg-[#f5f4f2] flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white border border-[#e8e1dc] rounded-3xl p-6 shadow-xl">
      <div class="text-center mb-6">
        <div class="w-16 h-16 rounded-3xl bg-[#2f1a14] text-white flex items-center justify-center mx-auto mb-3 text-2xl font-black">D</div>
        <h1 class="text-2xl font-black text-[#2f1a14]">Drex Chat</h1>
        <p class="text-sm text-[#8d7d75] mt-1">Mensajería conectada con tu cuenta de la plataforma.</p>
      </div>
      <div class="space-y-3">
        <input id="auth-email" type="email" autocomplete="email" placeholder="Correo electrónico" class="w-full h-12 px-4 rounded-2xl border border-[#e8e1dc] bg-[#f8f6f4] focus:outline-none focus:ring-2 focus:ring-[#cdbeb7]">
        <input id="auth-password" type="password" autocomplete="current-password" placeholder="Contraseña" class="w-full h-12 px-4 rounded-2xl border border-[#e8e1dc] bg-[#f8f6f4] focus:outline-none focus:ring-2 focus:ring-[#cdbeb7]">
        <p id="auth-error" class="hidden text-sm text-red-500"></p>
        <button onclick="signInChatEmail()" class="w-full h-12 rounded-2xl bg-[#2f1a14] text-white font-black active:scale-[0.99] transition">Entrar</button>
        <button onclick="signUpChatEmail()" class="w-full h-12 rounded-2xl bg-[#f1ece9] text-[#2f1a14] font-bold active:scale-[0.99] transition">Crear cuenta</button>
        <button onclick="signInChatGoogle()" class="w-full h-12 rounded-2xl border border-[#e8e1dc] bg-white text-[#2f1a14] font-bold active:scale-[0.99] transition">Continuar con Google</button>
      </div>
    </div>
  </div>

  <div id="chat-app-shell" class="hidden">
    <button onclick="signOutChatApp()" class="fixed top-4 right-4 z-[70] px-3 py-2 rounded-full bg-white border border-[#e8e1dc] text-xs font-bold text-[#5f4b44] shadow-sm">Salir</button>
<!-- VISTA CHAT -->
<div id="chat-inbox-view" class="fixed inset-0 bg-[#f5f4f2] text-[#2f1a14] overflow-y-auto hidden z-[64]">
  <div class="max-w-3xl mx-auto min-h-full px-4 pt-4 pb-24">
    <div class="sticky top-0 z-10 bg-[#f5f4f2] pb-3 border-b border-[#e8e1dc]">
      <div class="flex items-center justify-between py-2">
        <button onclick="openProfile()" aria-label="Mi perfil" class="rounded-full overflow-hidden border-2 border-[#e8e1dc] w-10 h-10">
          <img id="chat-inbox-profile-avatar" src="https://via.placeholder.com/80" class="w-full h-full object-cover" alt="Mi perfil">
        </button>
        <h2 class="text-xl font-black text-[#2f1a14]">Chat</h2>
        <div class="flex items-center gap-2">
          <button onclick="openCreateGroupChatView()" class="w-10 h-10 rounded-full bg-[#f1ece9] text-[#2f1a14] flex items-center justify-center active:scale-95 transition" aria-label="Crear grupo de chat">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5V18a4 4 0 00-5-3.87M17 20H7m10 0v-2c0-.65-.11-1.27-.31-1.85M7 20H2V18a4 4 0 015-3.87M7 20v-2c0-.65.11-1.27.31-1.85m0 0a5 5 0 019.38 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </button>
          <button onclick="openNewChatView()" class="w-10 h-10 rounded-full bg-[#2f1a14] text-white flex items-center justify-center active:scale-95 transition" aria-label="Nuevo chat">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
              <path d="M12 20h9" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="relative mt-2">
        <input id="chat-search-input" type="text" placeholder="Buscar chats" class="w-full h-11 pl-11 pr-12 rounded-full border border-[#e8e1dc] bg-white focus:outline-none focus:ring-2 focus:ring-[#cdbeb7]" oninput="filterChatConversations(); syncSearchClearButton('chat-search-input','chat-search-clear-btn')">
        <button id="chat-search-clear-btn" type="button" onclick="clearChatSearchInput()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-[#ece5e1] text-[#7a6962] hover:bg-[#e1d7d2] flex items-center justify-center transition" aria-label="Limpiar búsqueda de chats">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-[#8d7d75]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke-linecap="round" stroke-linejoin="round"></circle>
          <line x1="20" y1="20" x2="16.65" y2="16.65" stroke-linecap="round" stroke-linejoin="round"></line>
        </svg>
      </div>
    </div>
    <div id="chat-conversations-list" class="mt-4 space-y-2"></div>
  </div>
</div>

<!-- VISTA NUEVO CHAT -->
<div id="new-chat-view" class="fixed inset-0 bg-[#f5f4f2] text-[#2f1a14] overflow-y-auto hidden z-[65]">
  <div class="max-w-3xl mx-auto min-h-full px-4 pt-4 pb-24">
    <div class="sticky top-0 z-10 bg-[#f5f4f2] pb-3 border-b border-[#e8e1dc]">
      <div class="flex items-center justify-between py-2">
        <button onclick="closeNewChatView()" class="text-[#5f4b44] p-1" aria-label="Volver">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2 class="text-xl font-black text-[#2f1a14]">Nuevo Chat</h2>
        <span class="w-7 h-7"></span>
      </div>
      <div class="relative mt-2">
        <input id="new-chat-search-input" type="text" placeholder="Buscar usuario" class="w-full h-11 pl-11 pr-12 rounded-full border border-[#e8e1dc] bg-white focus:outline-none focus:ring-2 focus:ring-[#cdbeb7]" oninput="searchUsersForNewChat(this.value); syncSearchClearButton('new-chat-search-input','new-chat-search-clear-btn')">
        <button id="new-chat-search-clear-btn" type="button" onclick="clearNewChatSearchInput()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-[#ece5e1] text-[#7a6962] hover:bg-[#e1d7d2] flex items-center justify-center transition" aria-label="Limpiar búsqueda de usuarios">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-[#8d7d75]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke-linecap="round" stroke-linejoin="round"></circle>
          <line x1="20" y1="20" x2="16.65" y2="16.65" stroke-linecap="round" stroke-linejoin="round"></line>
        </svg>
      </div>
    </div>
    <div id="new-chat-results" class="mt-4 space-y-2"></div>
  </div>
</div>

<!-- VISTA CREAR GRUPO DE CHAT -->
<div id="create-group-chat-view" class="fixed inset-0 bg-[#f5f4f2] text-[#2f1a14] overflow-y-auto hidden z-[66]">
  <div class="max-w-3xl mx-auto min-h-full px-4 pt-4 pb-28">
    <div class="sticky top-0 z-10 bg-[#f5f4f2] pb-3 border-b border-[#e8e1dc]">
      <div class="flex items-center justify-between py-2">
        <button onclick="closeCreateGroupChatView()" class="text-[#5f4b44] p-1" aria-label="Volver">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2 class="text-xl font-black text-[#2f1a14]">Nuevo grupo</h2>
        <button onclick="createGroupChat()" class="px-4 py-1.5 rounded-full bg-[#2f1a14] text-white text-sm font-semibold disabled:opacity-40" id="create-group-chat-btn">Crear</button>
      </div>
    </div>

    <!-- Nombre del grupo -->
    <div class="mt-5 bg-white border border-[#e8e1dc] rounded-3xl p-5">
      <label class="text-xs font-bold text-[#7a6962] uppercase tracking-wider">Nombre del grupo</label>
      <input id="group-chat-name-input" type="text" maxlength="40" placeholder="Ej: Amigos del trabajo" class="mt-2 w-full border border-[#e8e1dc] rounded-2xl px-4 py-3 bg-[#f8f6f4] focus:outline-none focus:ring-2 focus:ring-[#cdbeb7] text-[#2f1a14]">
    </div>

    <!-- Participantes seleccionados -->
    <div id="group-chat-selected-wrap" class="hidden mt-4">
      <p class="text-xs font-bold text-[#7a6962] uppercase tracking-wider mb-2">Participantes</p>
      <div id="group-chat-selected-list" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- Buscar usuarios -->
    <div class="mt-4">
      <p class="text-xs font-bold text-[#7a6962] uppercase tracking-wider mb-2">Agregar personas</p>
      <div class="relative">
        <input id="group-chat-search-input" type="text" placeholder="Buscar usuario" class="w-full h-11 pl-11 pr-4 rounded-full border border-[#e8e1dc] bg-white focus:outline-none focus:ring-2 focus:ring-[#cdbeb7]" oninput="searchUsersForGroupChat(this.value)">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-[#8d7d75]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="20" y1="20" x2="16.65" y2="16.65" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div id="group-chat-search-results" class="mt-3 space-y-2"></div>
    </div>
  </div>
</div>

<!-- VISTA CONVERSACIÓN -->
<div id="chat-room-view" class="fixed inset-0 bg-[#f5f4f2] text-[#2f1a14] hidden z-[66] flex flex-col">
  <div class="max-w-3xl mx-auto w-full h-full flex flex-col relative">
    <div class="sticky top-0 z-10 bg-[#f5f4f2] border-b border-[#e8e1dc] px-4 py-3">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button onclick="closeChatRoomView()" class="text-[#5f4b44] p-1" aria-label="Volver">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <img id="chat-room-user-image" src="https://via.placeholder.com/80" class="w-10 h-10 rounded-full object-cover border border-[#e8e1dc]" alt="Usuario">
          <div class="min-w-0">
            <p id="chat-room-username" class="font-black text-base truncate">Usuario</p>
            <div id="chat-temporary-pill" class="hidden mt-1 text-[11px] font-bold text-[#8a4b33] bg-[#f6e5dc] border border-[#edcfbe] px-2 py-0.5 rounded-full w-fit">Temporal · 24h</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="openChatRoomInfo()" class="w-9 h-9 rounded-full bg-white border border-[#e8e1dc] text-[#5f4b44] flex items-center justify-center active:scale-95 transition" aria-label="Info del chat">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
              <circle cx="12" cy="12" r="10" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="12" y1="8" x2="12" y2="8.01" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
              <line x1="12" y1="12" x2="12" y2="16" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div id="chat-room-temporary-pull-indicator" class="hidden absolute left-1/2 -translate-x-1/2 top-[74px] z-20 flex flex-col items-center pointer-events-none">
      <div id="chat-room-temporary-bubble" class="w-5 h-5 rounded-full bg-[#2f1a14] shadow-[0_6px_18px_rgba(47,26,20,0.25)] transition-all duration-100"></div>
      <p id="chat-room-temporary-text" class="mt-1 text-[10px] font-semibold text-[#6e5a52] opacity-80">Desliza para activar chat temporal</p>
    </div>
    <div id="chat-typing-indicator" class="hidden px-4 pb-1">
      <span class="text-xs text-[#8d7d75] italic" id="chat-typing-text">escribiendo...</span>
    </div>
    <div id="chat-room-messages" class="flex-1 overflow-y-auto px-4 py-4 space-y-3"></div>

    <!-- Reply preview bar -->
    <div id="chat-reply-preview" class="hidden border-t border-[#e8e1dc] bg-[#f8f6f4] px-4 py-2">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-0.5 h-8 bg-[#2f1a14] rounded-full shrink-0"></div>
          <div class="min-w-0">
            <p class="text-[11px] font-bold text-[#2f1a14]" id="chat-reply-name">Nombre</p>
            <p class="text-xs text-[#8d7d75] truncate" id="chat-reply-text">mensaje...</p>
          </div>
        </div>
        <button onclick="clearChatReply()" class="w-7 h-7 rounded-full bg-[#e8e1dc] text-[#5f4b44] flex items-center justify-center shrink-0 text-xs active:scale-90 transition" aria-label="Cancelar respuesta">✕</button>
      </div>
    </div>

    <div class="border-t border-[#e8e1dc] bg-white px-4 py-3">
      <div id="chat-photo-preview-wrap" class="hidden mb-2">
        <div class="relative inline-block">
          <img id="chat-photo-preview-img" src="" class="w-20 h-20 rounded-xl object-cover border border-[#e8e1dc]" alt="Foto a enviar">
          <button onclick="clearChatPhotoAttachment()" class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-[#2f1a14] text-white text-xs">✕</button>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <label for="chat-photo-input" class="w-10 h-10 rounded-full bg-[#f1ece9] text-[#5f4b44] flex items-center justify-center cursor-pointer active:scale-95 transition" aria-label="Adjuntar foto">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2.5"></rect>
            <circle cx="8.5" cy="9" r="1.5"></circle>
            <path d="M21 16l-5.2-5.2a1.5 1.5 0 0 0-2.1 0L6 18" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </label>
        <input id="chat-photo-input" type="file" accept="image/*" class="hidden" onchange="handleChatPhotoAttachment(event)">
        <button onclick="openChatCamera()" class="w-10 h-10 rounded-full bg-[#f1ece9] text-[#5f4b44] flex items-center justify-center active:scale-95 transition" aria-label="Cámara">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="13" r="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <input id="chat-room-input" type="text" placeholder="Escribe un mensaje..." class="flex-1 h-11 px-4 rounded-full border border-[#e8e1dc] focus:outline-none focus:ring-2 focus:ring-[#cdbeb7]" oninput="handleChatTyping()">
        <button onclick="sendChatMessage()" class="w-11 h-11 rounded-full bg-[#2f1a14] text-white flex items-center justify-center active:scale-95 transition" aria-label="Enviar mensaje">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
            <path d="M12 19V5" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M6 11l6-6 6 6" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- REACTION PICKER FLOTANTE -->
<div id="chat-reaction-picker" class="fixed hidden z-[80] bg-white border border-[#e8e1dc] rounded-2xl shadow-2xl overflow-hidden transition-all" style="transform:scale(0.85);opacity:0;width:220px;">
  <div class="flex items-center justify-around px-3 py-2.5 border-b border-[#f0ebe8]">
    <button onclick="submitChatReaction('❤️')" class="text-2xl active:scale-75 transition hover:scale-125 leading-none">❤️</button>
    <button onclick="submitChatReaction('😂')" class="text-2xl active:scale-75 transition hover:scale-125 leading-none">😂</button>
    <button onclick="submitChatReaction('😮')" class="text-2xl active:scale-75 transition hover:scale-125 leading-none">😮</button>
    <button onclick="submitChatReaction('👍')" class="text-2xl active:scale-75 transition hover:scale-125 leading-none">👍</button>
    <button onclick="submitChatReaction('👎')" class="text-2xl active:scale-75 transition hover:scale-125 leading-none">👎</button>
    <button onclick="submitChatReaction('🔥')" class="text-2xl active:scale-75 transition hover:scale-125 leading-none">🔥</button>
  </div>
  <div class="flex items-center border-b border-[#f0ebe8]">
    <button onclick="triggerChatReply()" class="flex-1 flex items-center justify-center gap-1.5 py-2.5 text-xs font-semibold text-[#5f4b44] hover:bg-[#f8f4f1] active:bg-[#f1ece9] transition border-r border-[#f0ebe8]" aria-label="Responder">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M9 17l-5-5 5-5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 12h11a5 5 0 0 1 5 5v1" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Responder
    </button>
    <button onclick="triggerChatForward()" class="flex-1 flex items-center justify-center gap-1.5 py-2.5 text-xs font-semibold text-[#5f4b44] hover:bg-[#f8f4f1] active:bg-[#f1ece9] transition" aria-label="Reenviar">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 17l5-5-5-5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12H9a5 5 0 0 0-5 5v1" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Reenviar
    </button>
  </div>
  <div id="chat-reaction-delete-row" class="hidden">
    <button onclick="deleteChatMessage()" class="w-full flex items-center justify-center gap-1.5 py-2.5 text-xs font-semibold text-red-500 hover:bg-red-50 active:bg-red-100 transition" aria-label="Eliminar mensaje">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Eliminar mensaje
    </button>
  </div>
</div>

<!-- VISTA CÁMARA CHAT (TikTok-style) -->
<div id="chat-camera-view" class="fixed inset-0 bg-black hidden z-[95] flex flex-col overflow-hidden">

  <!-- Fondo / live feed -->
  <video id="chat-camera-video" class="absolute inset-0 w-full h-full object-cover" autoplay playsinline muted></video>
  <canvas id="chat-camera-canvas" class="absolute inset-0 w-full h-full object-cover hidden"></canvas>

  <!-- Overlay de filtro CSS (se aplica sobre el video) -->
  <div id="chat-camera-filter-overlay" class="absolute inset-0 pointer-events-none" style="mix-blend-mode:normal;"></div>

  <!-- Top bar -->
  <div class="relative z-10 flex items-center justify-between px-5 pt-12 pb-3">

  if (!user) return Promise.resolve();
  const ref = firebase.database().ref('users/' + user.uid);
  return ref.once('value').then(snapshot => {
    const existing = snapshot.val() || {};
    const updates = {
      email: existing.email || user.email || '',
      username: existing.username || user.displayName || (user.email ? user.email.split('@')[0] : 'Usuario'),
      profileImage: existing.profileImage || user.photoURL || '',
      lastChatLoginAt: Date.now()
    };
    return ref.update(updates);
  }).catch(() => {});
}

let allChatConversations = [];

const CHAT_CACHE_TTL_MS = 25000;
const CHAT_USERS_CACHE_TTL_MS = 60000;
const CHAT_USERS_INDEX_LIMIT = 180;
const CHAT_MESSAGES_LIMIT = 80;
const CHAT_TEMPORARY_DURATION_MS = 24 * 60 * 60 * 1000;
const CHAT_TEMP_PULL_TRIGGER_PX = 82;
