<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drex Sleep Mode - Zzz</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle at top, #1f1c2c 0%, #09090f 55%, #050507 100%);
            color: #e8e1dc;
            min-height: 100vh;
            margin: 0;
            padding: 1.25rem;
        }
        .sleep-shell {
            width: min(560px, 100%);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .glass {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(232, 225, 220, 0.12);
            border-radius: 28px;
            backdrop-filter: blur(14px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.22);
        }
        .zzz-container { position: relative; height: 140px; }
        .zzz {
            position: absolute;
            font-weight: 900;
            color: #FE2C55;
            opacity: 0;
            animation: float-zzz 4s infinite linear;
        }
        .zzz:nth-child(1) { font-size: 2rem; left: 35%; bottom: 6%; animation-delay: 0s; }
        .zzz:nth-child(2) { font-size: 3rem; left: 48%; bottom: 6%; animation-delay: 1.2s; }
        .zzz:nth-child(3) { font-size: 4.2rem; left: 60%; bottom: 6%; animation-delay: 2.4s; }
        @keyframes float-zzz {
            0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
            20% { opacity: 0.85; }
            80% { opacity: 0.3; }
            100% { transform: translate(38px, -105px) scale(1.2); opacity: 0; }
        }

        .timer { font-size: clamp(2.3rem, 9vw, 4rem); font-weight: 900; letter-spacing: -1px; color: #fff; text-shadow: 0 0 22px rgba(254, 44, 85, 0.35); }
        .btn {
            border-radius: 999px;
            padding: .62rem 1rem;
            font-weight: 800;
            font-size: .9rem;
            border: 1px solid transparent;
            transition: .2s ease;
        }
        .btn:active { transform: scale(.97); }
        .btn-primary { background: #FE2C55; color: white; }
        .btn-primary:hover { background: #f01446; }
        .btn-soft { background: rgba(255,255,255,.08); color: #efe8e3; border-color: rgba(255,255,255,.12); }
        .btn-soft.active { background: #16a34a; color: white; border-color: transparent; }
        .input {
            width: 100%;
            background: rgba(10,10,12,0.4);
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 14px;
            color: #fff;
            padding: .65rem .75rem;
            outline: none;
        }
        .input:focus { border-color: #FE2C55; box-shadow: 0 0 0 3px rgba(254,44,85,.2); }

        .moon {
            width: 72px;
            height: 72px;
            border-radius: 999px;
            background: radial-gradient(circle at 30% 30%, #fff9d8, #e4d9b4 60%, #baa97c 100%);
            box-shadow: 0 0 35px rgba(252, 238, 194, .32);
            margin: 0 auto;
        }

        .back-arrow {
            position: fixed;
            top: 18px;
            left: 18px;
            color: #fff;
            padding: 10px;
            border-radius: 999px;
            background: rgba(255,255,255,.1);
            transition: .2s;
            z-index: 100;
        }
        .back-arrow:hover { background: rgba(254,44,85,.22); transform: scale(1.05); }
    </style>
</head>
<body>
    <a href="index.html" class="back-arrow" aria-label="Volver">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>

    <main class="sleep-shell">
        <section class="glass p-5 text-center">
            <div class="moon mb-3"></div>
            <div class="zzz-container">
                <span class="zzz">Z</span><span class="zzz">Z</span><span class="zzz">z</span>
            </div>
            <div class="timer" id="countdown">08:00:00</div>
            <p id="sleep-status" class="text-sm text-[#c7bbb4] mt-2">Descanso activo ✨</p>

            <div class="grid grid-cols-2 gap-2 mt-4 text-left">
                <div>
                    <label class="text-xs text-[#c7bbb4] mb-1 block">Horas</label>
                    <input id="timer-hours" type="number" min="0" max="23" value="8" class="input">
                </div>
                <div>
                    <label class="text-xs text-[#c7bbb4] mb-1 block">Minutos</label>
                    <input id="timer-minutes" type="number" min="0" max="59" value="0" class="input">
                </div>
            </div>

            <div class="flex flex-wrap gap-2 mt-4 justify-center">
                <button id="apply-timer" class="btn btn-primary">Editar temporizador</button>
                <button id="toggle-pause" class="btn btn-soft">Pausar</button>
                <button id="toggle-loop" class="btn btn-soft">Bucle: OFF</button>
                <button id="toggle-music" class="btn btn-soft">Música: ON</button>
            </div>
        </section>

        <section class="glass p-5">
            <h2 class="text-lg font-black mb-2 text-[#FE2C55]">Sleep Mode interactivo</h2>
            <p class="text-sm text-[#d0c4be] leading-relaxed">
                Respira profundo. Ajusta tu temporizador, activa el bucle si deseas repetir cada sesión y disfruta una melodía suave estilo
                <strong>"Estrellita"</strong> para dormir mejor.
            </p>
        </section>
    </main>

    <script>
        const timerElement = document.getElementById('countdown');
        const statusElement = document.getElementById('sleep-status');
        const hoursInput = document.getElementById('timer-hours');
        const minutesInput = document.getElementById('timer-minutes');
        const loopButton = document.getElementById('toggle-loop');
        const musicButton = document.getElementById('toggle-music');
        const pauseButton = document.getElementById('toggle-pause');

        let initialSeconds = 8 * 60 * 60;
        let seconds = initialSeconds;
        let isPaused = false;
        let loopEnabled = false;

        function formatClock(totalSeconds) {
            const safe = Math.max(0, totalSeconds);
            const h = Math.floor(safe / 3600);
            const m = Math.floor((safe % 3600) / 60);
            const s = safe % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function refreshTimerUI() {
            timerElement.textContent = formatClock(seconds);
        }

        function applyTimerSettings() {
            const h = Math.max(0, Math.min(23, Number(hoursInput.value) || 0));
            const m = Math.max(0, Math.min(59, Number(minutesInput.value) || 0));
            const total = (h * 3600) + (m * 60);
            if (total <= 0) {
                statusElement.textContent = 'Pon al menos 1 minuto para iniciar.';
                return;
            }
            initialSeconds = total;
            seconds = total;
            isPaused = false;
            pauseButton.textContent = 'Pausar';
            statusElement.textContent = `Temporizador actualizado a ${formatClock(total)}.`;
            refreshTimerUI();
        }

        setInterval(() => {
            if (isPaused) return;
            if (seconds > 0) {
                seconds -= 1;
                refreshTimerUI();
                return;
            }

            if (loopEnabled) {
                seconds = initialSeconds;
                statusElement.textContent = 'Sesión finalizada, reiniciando por bucle.';
                refreshTimerUI();
            } else {
                statusElement.textContent = 'Sleep Mode completado. Dulces sueños 🌙';
                isPaused = true;
                pauseButton.textContent = 'Reanudar';
            }
        }, 1000);

        document.getElementById('apply-timer').addEventListener('click', applyTimerSettings);

        pauseButton.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseButton.textContent = isPaused ? 'Reanudar' : 'Pausar';
            statusElement.textContent = isPaused ? 'Temporizador en pausa.' : 'Descanso activo ✨';
        });

        loopButton.addEventListener('click', () => {
            loopEnabled = !loopEnabled;
            loopButton.textContent = `Bucle: ${loopEnabled ? 'ON' : 'OFF'}`;
            loopButton.classList.toggle('active', loopEnabled);
        });

        // Música de cuna estilo "Estrellita" usando WebAudio.
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioCtx ? new AudioCtx() : null;
        let musicOn = true;

        const lullabyPattern = [
            ['C4', 0.45], ['C4', 0.45], ['G4', 0.45], ['G4', 0.45], ['A4', 0.45], ['A4', 0.45], ['G4', 0.9],
            ['F4', 0.45], ['F4', 0.45], ['E4', 0.45], ['E4', 0.45], ['D4', 0.45], ['D4', 0.45], ['C4', 0.9]
        ];

        const noteFreq = {
            C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00
        };

        function playTone(freq, start, duration) {
            if (!audioCtx || !musicOn) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, start);

            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(0.06, start + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(start);
            osc.stop(start + duration + 0.03);
        }

        function scheduleLullabyLoop() {
            if (!audioCtx) return;
            let now = audioCtx.currentTime + 0.04;
            lullabyPattern.forEach(([note, duration]) => {
                playTone(noteFreq[note], now, duration);
                now += duration;
            });
            setTimeout(scheduleLullabyLoop, 7600);
        }

        if (audioCtx) {
            document.body.addEventListener('click', async () => {
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
            }, { once: true });
            scheduleLullabyLoop();
        }

        musicButton.addEventListener('click', () => {
            musicOn = !musicOn;
            musicButton.textContent = `Música: ${musicOn ? 'ON' : 'OFF'}`;
            musicButton.classList.toggle('active', musicOn);
            if (!audioCtx) {
                statusElement.textContent = 'Tu navegador no soporta WebAudio para la música.';
            }
        });

        refreshTimerUI();
    </script>
</body>
</html>
