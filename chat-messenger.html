<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drex Messenger</title>
  <link rel="icon" href="ashhhh.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    :root{--ink:#2f1a14;--muted:#8d7d75;--paper:#f5f4f2;--line:#e8e1dc;--soft:#f1ece9;--accent:#3a241d}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}
    .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}.glass{background:rgba(255,255,255,.88);backdrop-filter:blur(18px)}
    .chat-selected{outline:2px solid #3a241d;outline-offset:2px}.bubble-shadow{box-shadow:0 8px 24px rgba(47,26,20,.08)}
    .fade-in{animation:fadeIn .18s ease-out both}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .typing-dot{width:6px;height:6px;border-radius:999px;background:#b4a9a4;animation:bounce 1s infinite}.typing-dot:nth-child(2){animation-delay:.15s}.typing-dot:nth-child(3){animation-delay:.3s}@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.55}40%{transform:translateY(-4px);opacity:1}}
  </style>
</head>
<body>
  <main id="auth-view" class="min-h-screen bg-white flex flex-col px-7 py-8">
    <section class="max-w-md mx-auto w-full flex-1 flex flex-col justify-center">
      <div class="mb-10">
        <p class="text-sm font-black tracking-[.28em] uppercase text-[#c1b0a8]">Drex</p>
        <h1 class="mt-2 text-5xl font-black tracking-tight text-[var(--accent)]">Messenger</h1>
        <p class="mt-3 text-sm text-[var(--muted)]">Chat independiente clonado desde la plataforma principal: inicio de sesión, registro, bandeja, búsqueda, chats directos, grupos, fotos, reacciones y notas.</p>
      </div>
      <form id="auth-form" class="space-y-3">
        <input id="auth-name" class="hidden w-full h-12 rounded-2xl border border-[var(--line)] px-4 outline-none focus:ring-2 focus:ring-[#cdbeb7]" placeholder="Nombre de usuario" autocomplete="nickname">
        <input id="auth-email" type="email" class="w-full h-12 rounded-2xl border border-[var(--line)] px-4 outline-none focus:ring-2 focus:ring-[#cdbeb7]" placeholder="Correo electrónico" autocomplete="email" required>
        <input id="auth-password" type="password" class="w-full h-12 rounded-2xl border border-[var(--line)] px-4 outline-none focus:ring-2 focus:ring-[#cdbeb7]" placeholder="Contraseña" autocomplete="current-password" required>
        <button id="auth-submit" class="w-full h-12 rounded-2xl bg-[var(--accent)] text-white font-black active:scale-[.99] transition">Iniciar sesión</button>
      </form>
      <p id="auth-error" class="hidden mt-3 text-center text-sm font-bold text-red-500"></p>
      <button id="auth-toggle" class="mt-5 text-sm font-black text-[var(--accent)]">Crear cuenta nueva</button>
    </section>
  </main>

  <main id="app-view" class="hidden min-h-screen bg-[var(--paper)]">
    <section id="chat-inbox-view" class="fixed inset-0 overflow-y-auto bg-[var(--paper)] z-10">
      <header class="sticky top-0 z-20 glass border-b border-[var(--line)] px-4 pt-4 pb-3">
        <div class="flex items-center justify-between gap-3">
          <button id="my-profile-btn" class="flex items-center gap-3 min-w-0 text-left">
            <img id="chat-inbox-profile-avatar" src="https://via.placeholder.com/80" class="w-12 h-12 rounded-full object-cover border border-[var(--line)]" alt="Mi perfil">
            <div class="min-w-0"><h2 class="text-2xl font-black leading-tight">Chats</h2><p id="my-user-label" class="text-xs text-[var(--muted)] truncate">Conectando...</p></div>
          </button>
          <div class="flex gap-2">
            <button onclick="openCreateGroupChatView()" class="w-10 h-10 rounded-full bg-[var(--soft)] flex items-center justify-center"><i class="fa-solid fa-user-group"></i></button>
            <button onclick="openNewChatView()" class="w-10 h-10 rounded-full bg-[var(--ink)] text-white flex items-center justify-center"><i class="fa-solid fa-pen"></i></button>
          </div>
        </div>
        <div class="relative mt-4"><i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-[#b4a9a4]"></i><input id="chat-search-input" oninput="filterChatConversations()" placeholder="Buscar chats" class="w-full h-11 pl-11 pr-4 rounded-full border border-[var(--line)] bg-white outline-none focus:ring-2 focus:ring-[#cdbeb7]"></div>
      </header>
      <section class="px-4 pt-4"><div id="chat-notes-scroll" class="flex gap-4 overflow-x-auto no-scrollbar py-2"></div><div id="chat-conversations-list" class="mt-2"></div></section>
    </section>

    <section id="new-chat-view" class="fixed inset-0 hidden z-30 bg-[var(--paper)] overflow-y-auto">
      <header class="sticky top-0 glass border-b border-[var(--line)] px-4 py-4"><div class="flex items-center gap-3"><button onclick="closeNewChatView()" class="w-10 h-10 rounded-full bg-white"><i class="fa-solid fa-chevron-left"></i></button><h2 class="font-black text-xl">Nuevo chat</h2></div><input id="new-chat-search-input" oninput="searchUsersForNewChat(this.value)" class="mt-4 w-full h-11 rounded-full border border-[var(--line)] px-4 outline-none" placeholder="Buscar usuarios"></header>
      <div id="new-chat-results" class="p-4 space-y-2"></div>
    </section>

    <section id="create-group-chat-view" class="fixed inset-0 hidden z-30 bg-[var(--paper)] overflow-y-auto">
      <header class="sticky top-0 glass border-b border-[var(--line)] px-4 py-4 flex items-center justify-between"><button onclick="closeCreateGroupChatView()" class="w-10 h-10 rounded-full bg-white"><i class="fa-solid fa-chevron-left"></i></button><h2 class="font-black text-lg">Nuevo grupo</h2><button onclick="createGroupChat()" class="px-4 py-2 rounded-full bg-[var(--ink)] text-white text-sm font-black">Crear</button></header>
      <div class="p-4"><input id="group-chat-name-input" maxlength="40" class="w-full rounded-2xl border border-[var(--line)] bg-white px-4 py-3 outline-none" placeholder="Nombre del grupo"><div id="group-chat-selected-list" class="flex flex-wrap gap-2 mt-3"></div><input id="group-chat-search-input" oninput="searchUsersForGroupChat(this.value)" class="mt-4 w-full h-11 rounded-full border border-[var(--line)] px-4 outline-none" placeholder="Buscar usuarios"><div id="group-chat-search-results" class="mt-3 space-y-2"></div></div>
    </section>

    <section id="chat-room-view" class="fixed inset-0 hidden z-40 bg-white flex flex-col">
      <header class="shrink-0 glass border-b border-[var(--line)] px-3 py-3 flex items-center gap-3"><button onclick="closeChatRoomView()" class="w-10 h-10 rounded-full bg-[var(--soft)]"><i class="fa-solid fa-chevron-left"></i></button><img id="chat-room-user-image" src="https://via.placeholder.com/80" class="w-11 h-11 rounded-full object-cover border border-[var(--line)]"><div id="chat-room-group-avatar" class="hidden w-11 h-11 rounded-full bg-[var(--soft)] items-center justify-center"><i class="fa-solid fa-user-group"></i></div><div class="min-w-0 flex-1"><p id="chat-room-username" class="font-black truncate">Usuario</p><p id="chat-room-status" class="hidden text-xs text-green-500 font-bold">En línea</p></div><button onclick="openChatRoomInfo()" class="w-10 h-10 rounded-full bg-[var(--soft)]"><i class="fa-solid fa-circle-info"></i></button></header>
      <div id="chat-pinned-banner" class="hidden px-4 py-2 bg-[#fff8f4] border-b border-[var(--line)] text-xs"><b>Fijado:</b> <span id="chat-pinned-text"></span></div>
      <div id="chat-room-messages" class="flex-1 overflow-y-auto px-4 py-5 space-y-3"></div>
      <div id="chat-typing-indicator" class="hidden px-4 pb-2"><div class="inline-flex items-center gap-1 bg-[var(--soft)] rounded-full px-3 py-2"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>
      <div id="chat-reply-preview" class="hidden border-t border-[var(--line)] bg-[#f8f6f4] px-4 py-2 flex items-center justify-between"><div class="min-w-0"><p id="chat-reply-name" class="text-xs font-black"></p><p id="chat-reply-text" class="text-xs text-[var(--muted)] truncate"></p></div><button onclick="clearChatReply()"><i class="fa-solid fa-xmark"></i></button></div>
      <footer class="shrink-0 border-t border-[var(--line)] bg-white px-3 py-3"><div id="chat-photo-thumbnails" class="flex gap-2 pb-2 overflow-x-auto"></div><div class="flex items-end gap-2"><label for="chat-photo-input" class="w-10 h-10 rounded-full bg-[var(--soft)] flex items-center justify-center shrink-0"><i class="fa-regular fa-image"></i></label><input id="chat-photo-input" type="file" accept="image/*" multiple class="hidden" onchange="handleChatPhotoAttachment(event)"><div class="flex-1 min-h-10 rounded-3xl bg-[var(--paper)] px-4 py-2 flex items-center"><input id="chat-room-input" oninput="handleChatTyping();updateChatToolbarMode()" onkeydown="if(event.key==='Enter'){event.preventDefault();sendChatMessage()}" class="w-full bg-transparent outline-none" placeholder="Mensaje..."></div><button id="chat-heart-btn" onclick="sendQuickHeartMessage()" class="w-10 h-10 rounded-full bg-[var(--soft)]">❤️</button><button id="chat-send-btn" onclick="sendChatMessage()" class="hidden w-10 h-10 rounded-full bg-[var(--ink)] text-white"><i class="fa-solid fa-arrow-up"></i></button></div></footer>
    </section>
  </main>
<script>
const firebaseConfig={apiKey:"AIzaSyC9v2qp6zGtmvsFiOknlmTHnN6zZY1RLcI",authDomain:"ggggg-f2508.firebaseapp.com",databaseURL:"https://ggggg-f2508-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"ggggg-f2508",storageBucket:"ggggg-f2508.firebasestorage.app",messagingSenderId:"120837533638",appId:"1:120837533638:web:dab060eedf39a6d19f4cc7"};
firebase.initializeApp(firebaseConfig);const db=firebase.database(),auth=firebase.auth(),storage=firebase.storage();
let authMode='login',currentChatRoomId=null,currentChatRecipient=null,currentChatIsGroup=false,currentGroupMembers=[],allChatConversations=[],chatUsersIndexCache=[],chatPhotoAttachments=[],messagesRef=null,typingRef=null,typingTimer=null,chatReplyContext=null,selectedGroupUsers=new Map();
const $=id=>document.getElementById(id),escapeHtml=s=>(s||'').toString().replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
function directId(a,b){return [a,b].sort().join('_');} function fmt(ts){if(!ts)return'';let d=new Date(ts),n=Date.now(),m=Math.floor((n-ts)/60000);return m<1?'Ahora':m<60?m+'m':m<1440?Math.floor(m/60)+'h':d.toLocaleDateString('es',{day:'2-digit',month:'short'});} 
$('auth-toggle').onclick=()=>{authMode=authMode==='login'?'register':'login';$('auth-name').classList.toggle('hidden',authMode==='login');$('auth-submit').textContent=authMode==='login'?'Iniciar sesión':'Crear cuenta';$('auth-toggle').textContent=authMode==='login'?'Crear cuenta nueva':'Ya tengo cuenta';};
$('auth-form').onsubmit=async e=>{e.preventDefault();$('auth-error').classList.add('hidden');let email=$('auth-email').value.trim(),pass=$('auth-password').value;try{if(authMode==='register'){let cred=await auth.createUserWithEmailAndPassword(email,pass),name=$('auth-name').value.trim()||email.split('@')[0];await db.ref('users/'+cred.user.uid).update({username:name,displayName:name,email,createdAt:Date.now(),profileImage:''});}else await auth.signInWithEmailAndPassword(email,pass);}catch(err){$('auth-error').textContent=err.message;$('auth-error').classList.remove('hidden');}};
auth.onAuthStateChanged(async user=>{if(!user){$('auth-view').classList.remove('hidden');$('app-view').classList.add('hidden');return;}$('auth-view').classList.add('hidden');$('app-view').classList.remove('hidden');let s=await db.ref('users/'+user.uid).once('value'),u=s.val()||{};$('my-user-label').textContent='@'+(u.username||user.email);if(u.profileImage)$('chat-inbox-profile-avatar').src=u.profileImage;setPresence();loadChatNotes();loadChatConversations();});
function setPresence(){let u=auth.currentUser;if(!u)return;let r=db.ref('userPresence/'+u.uid);r.set({online:true,lastSeen:Date.now()});r.onDisconnect().set({online:false,lastSeen:Date.now()});}
async function getProfile(uid){let c=chatUsersIndexCache.find(x=>x.uid===uid);if(c)return c;let s=await db.ref('users/'+uid).once('value'),d=s.val()||{},p={uid,name:d.username||d.displayName||d.email||'Usuario',image:d.profileImage||'https://via.placeholder.com/80',normalizedName:(d.username||d.displayName||d.email||'').toLowerCase()};chatUsersIndexCache.push(p);return p;}
async function ensureUsers(){if(chatUsersIndexCache.length)return chatUsersIndexCache;let me=auth.currentUser.uid,s=await db.ref('users').limitToFirst(500).once('value');s.forEach(ch=>{if(ch.key!==me){let d=ch.val()||{};chatUsersIndexCache.push({uid:ch.key,name:d.username||d.displayName||d.email||'Usuario',image:d.profileImage||'https://via.placeholder.com/80',normalizedName:(d.username||d.displayName||d.email||'').toLowerCase()});}});return chatUsersIndexCache;}
async function loadChatConversations(){let u=auth.currentUser,c=$('chat-conversations-list');if(!u)return;c.innerHTML='<p class="py-8 text-center text-sm text-[var(--muted)]">Cargando chats...</p>';let s=await db.ref('userConversations/'+u.uid).once('value'),map=s.val()||{},items=[];for(let id of Object.keys(map)){let m=map[id]||{};if(m.isGroup)items.push({id,isGroup:true,groupName:m.groupName||'Grupo',lastMessage:m.lastMessage||'',updatedAt:m.updatedAt||0});else{let other=m.otherUid||id.split('_').find(x=>x!==u.uid),p=await getProfile(other);items.push({id,otherUid:other,otherName:p.name,otherImage:p.image,lastMessage:m.lastMessage||'',updatedAt:m.updatedAt||0});}}allChatConversations=items.sort((a,b)=>b.updatedAt-a.updatedAt);renderChatConversations(allChatConversations);}
function renderChatConversations(items){let c=$('chat-conversations-list');if(!items.length){c.innerHTML='<div class="bg-white border border-[var(--line)] rounded-3xl p-8 text-center text-[var(--muted)]">Aún no tienes conversaciones. Toca escribir para iniciar una.</div>';return;}c.innerHTML=items.map(i=>i.isGroup?`<button onclick="openGroupChatRoom('${i.id}')" class="w-full flex items-center gap-3 p-4 bg-white border-b border-[var(--line)] text-left"><div class="w-14 h-14 rounded-full bg-[var(--soft)] flex items-center justify-center"><i class="fa-solid fa-user-group"></i></div><div class="min-w-0 flex-1"><div class="flex justify-between gap-2"><b class="truncate">${escapeHtml(i.groupName)}</b><span class="text-xs text-[#b4a9a4]">${fmt(i.updatedAt)}</span></div><p class="text-sm text-[var(--muted)] truncate">${escapeHtml(i.lastMessage||'Nueva conversación')}</p></div></button>`:`<button onclick="openChatRoomFromInbox('${i.otherUid}')" class="w-full flex items-center gap-3 p-4 bg-white border-b border-[var(--line)] text-left"><img src="${i.otherImage}" class="w-14 h-14 rounded-full object-cover"><div class="min-w-0 flex-1"><div class="flex justify-between gap-2"><b class="truncate">${escapeHtml(i.otherName)}</b><span class="text-xs text-[#b4a9a4]">${fmt(i.updatedAt)}</span></div><p class="text-sm text-[var(--muted)] truncate">${escapeHtml(i.lastMessage||'Nueva conversación')}</p></div></button>`).join('');}
function filterChatConversations(){let q=$('chat-search-input').value.toLowerCase();renderChatConversations(allChatConversations.filter(i=>(i.otherName||i.groupName||'').toLowerCase().includes(q)||(i.lastMessage||'').toLowerCase().includes(q)));}
function openNewChatView(){$('chat-inbox-view').classList.add('hidden');$('new-chat-view').classList.remove('hidden');$('new-chat-results').innerHTML='<div class="bg-white rounded-3xl p-5 text-center text-[var(--muted)]">Escribe para buscar usuarios.</div>'}function closeNewChatView(){$('new-chat-view').classList.add('hidden');$('chat-inbox-view').classList.remove('hidden')}
async function searchUsersForNewChat(q){let l=$('new-chat-results');q=(q||'').toLowerCase().trim();if(!q){l.innerHTML='<div class="bg-white rounded-3xl p-5 text-center text-[var(--muted)]">Escribe para buscar usuarios.</div>';return;}let users=(await ensureUsers()).filter(x=>x.normalizedName.includes(q)).slice(0,30);l.innerHTML=users.length?users.map(x=>`<button onclick="openChatFromUserSelection('${x.uid}')" class="w-full flex items-center gap-3 bg-white border border-[var(--line)] rounded-2xl p-3 text-left"><img src="${x.image}" class="w-12 h-12 rounded-full object-cover"><b>${escapeHtml(x.name)}</b></button>`).join(''):'<div class="bg-white rounded-3xl p-5 text-center text-[var(--muted)]">No encontramos usuarios.</div>';}
function openChatFromUserSelection(uid){closeNewChatView();openChatRoomFromInbox(uid)}
async function ensureConversation(me,other){let id=directId(me,other),now=Date.now();await db.ref('conversations/'+id+'/participants').update({[me]:true,[other]:true});await db.ref('userConversations/'+me+'/'+id).update({otherUid:other,updatedAt:now});await db.ref('userConversations/'+other+'/'+id).update({otherUid:me,updatedAt:now});return id;}
async function openChatRoomFromInbox(other){let me=auth.currentUser.uid;currentChatIsGroup=false;currentChatRecipient=other;currentChatRoomId=await ensureConversation(me,other);let p=await getProfile(other);$('chat-room-username').textContent=p.name;$('chat-room-user-image').src=p.image;$('chat-room-user-image').classList.remove('hidden');$('chat-room-group-avatar').classList.add('hidden');showRoom();subscribeMessages();subscribeTyping();db.ref('userPresence/'+other+'/online').on('value',s=>$('chat-room-status').classList.toggle('hidden',s.val()!==true));}
function showRoom(){$('chat-inbox-view').classList.add('hidden');$('chat-room-view').classList.remove('hidden');$('chat-room-input').focus();}
function closeChatRoomView(){if(messagesRef)messagesRef.off();if(typingRef)typingRef.off();$('chat-room-view').classList.add('hidden');$('chat-inbox-view').classList.remove('hidden');loadChatConversations();}
function subscribeMessages(){let c=$('chat-room-messages');c.innerHTML='';messagesRef=db.ref('conversationMessages/'+currentChatRoomId).limitToLast(80);messagesRef.on('child_added',s=>renderMessage(s.key,s.val()||{}));}
async function renderMessage(id,m){let me=auth.currentUser.uid,mine=m.senderId===me,p=mine?{name:'Tú'}:await getProfile(m.senderId),c=$('chat-room-messages'),imgs=(m.images||[]).map(u=>`<img src="${u}" class="rounded-2xl max-w-[240px] mb-1" onclick="window.open('${u}','_blank')">`).join('');let el=document.createElement('div');el.className='w-full flex '+(mine?'justify-end':'justify-start')+' fade-in';el.dataset.msgId=id;el.innerHTML=`<div class="max-w-[82%]"><div class="${mine?'bg-[var(--ink)] text-white':'bg-[var(--soft)] text-[var(--ink)]'} rounded-3xl px-4 py-2.5 bubble-shadow"><p class="text-[11px] font-black opacity-60 mb-1">${escapeHtml(p.name)}</p>${m.replyTo?`<div class="mb-2 border-l-2 pl-2 opacity-70 text-xs">${escapeHtml(m.replyTo.text||'Foto')}</div>`:''}${imgs}${m.text?`<p class="break-words">${escapeHtml(m.text)}</p>`:''}</div><div class="mt-1 text-[10px] text-[#b4a9a4] ${mine?'text-right':'text-left'}">${fmt(m.timestamp||Date.now())} · <button onclick="replyToMessage('${id}','${escapeHtml(m.text||'Foto')}')">Responder</button></div></div>`;c.appendChild(el);c.scrollTop=c.scrollHeight;}
async function sendChatMessage(){let input=$('chat-room-input'),text=input.value.trim(),me=auth.currentUser;if(!text&&!chatPhotoAttachments.length)return;let imgs=chatPhotoAttachments.map(x=>x.url).filter(Boolean),payload={senderId:me.uid,text,images:imgs.length?imgs:null,timestamp:Date.now()};if(!payload.images)delete payload.images;if(chatReplyContext)payload.replyTo=chatReplyContext;input.value='';chatPhotoAttachments=[];$('chat-photo-thumbnails').innerHTML='';clearChatReply();updateChatToolbarMode();await db.ref('conversationMessages/'+currentChatRoomId).push(payload);await updatePreview(imgs.length?'📷 Foto':text,payload);} 
async function updatePreview(last,payload){let me=auth.currentUser.uid,now=payload.timestamp;if(currentChatIsGroup){for(let uid of currentGroupMembers)await db.ref('userConversations/'+uid+'/'+currentChatRoomId).update({isGroup:true,groupName:$('chat-room-username').textContent,lastMessage:last,updatedAt:now});await db.ref('groupConversations/'+currentChatRoomId).update({lastMessage:last,updatedAt:now});}else{await db.ref('conversations/'+currentChatRoomId).update({lastMessage:last,updatedAt:now});await db.ref('userConversations/'+me+'/'+currentChatRoomId).update({otherUid:currentChatRecipient,lastMessage:last,updatedAt:now});await db.ref('userConversations/'+currentChatRecipient+'/'+currentChatRoomId).update({otherUid:me,lastMessage:last,updatedAt:now});}}
function updateChatToolbarMode(){let has=$('chat-room-input').value.trim()||chatPhotoAttachments.length;$('chat-send-btn').classList.toggle('hidden',!has);$('chat-heart-btn').classList.toggle('hidden',!!has)}function sendQuickHeartMessage(){$('chat-room-input').value='❤️';sendChatMessage()}function replyToMessage(id,text){chatReplyContext={id,text};$('chat-reply-name').textContent='Responder';$('chat-reply-text').textContent=text;$('chat-reply-preview').classList.remove('hidden')}function clearChatReply(){chatReplyContext=null;$('chat-reply-preview').classList.add('hidden')}
async function handleChatPhotoAttachment(e){let files=[...e.target.files];for(let f of files){let path='chatImages/'+auth.currentUser.uid+'/'+Date.now()+'_'+f.name,ref=storage.ref(path);await ref.put(f);chatPhotoAttachments.push({url:await ref.getDownloadURL()});}$('chat-photo-thumbnails').innerHTML=chatPhotoAttachments.map(x=>`<img src="${x.url}" class="w-16 h-16 rounded-2xl object-cover">`).join('');updateChatToolbarMode();}
function handleChatTyping(){updateChatToolbarMode();if(!currentChatRoomId)return;let ref=db.ref('typing/'+currentChatRoomId+'/'+auth.currentUser.uid);ref.set(Date.now());clearTimeout(typingTimer);typingTimer=setTimeout(()=>ref.remove(),1400)}function subscribeTyping(){typingRef=db.ref('typing/'+currentChatRoomId);typingRef.on('value',s=>{let v=s.val()||{},me=auth.currentUser.uid,on=Object.keys(v).some(k=>k!==me&&Date.now()-v[k]<2500);$('chat-typing-indicator').classList.toggle('hidden',!on);});}
async function loadChatNotes(){let box=$('chat-notes-scroll'),u=auth.currentUser,s=await db.ref('profileNotes').limitToLast(20).once('value');let html=`<button onclick="editMyNote()" class="shrink-0 text-center"><img src="${$('chat-inbox-profile-avatar').src}" class="w-16 h-16 rounded-full object-cover border-2 border-[var(--line)]"><span class="text-xs font-bold">Tu nota</span></button>`;s.forEach(ch=>{let n=ch.val()||{};if(ch.key!==u.uid&&n.text)html+=`<div class="shrink-0 text-center max-w-[76px]"><div class="bg-white rounded-2xl px-2 py-1 text-[10px] truncate">${escapeHtml(n.text)}</div><div class="w-16 h-16 rounded-full bg-[var(--soft)] mt-1 mx-auto"></div></div>`});box.innerHTML=html;}function editMyNote(){let text=prompt('Nota visible 24h:');if(text!==null)db.ref('profileNotes/'+auth.currentUser.uid).set({text:text.slice(0,60),createdAt:Date.now()}).then(loadChatNotes)}
function toggleGroupUser(uid){let u=chatUsersIndexCache.find(x=>x.uid===uid);if(!u)return;if(selectedGroupUsers.has(uid))selectedGroupUsers.delete(uid);else selectedGroupUsers.set(uid,u);renderSelectedGroup()}
function openCreateGroupChatView(){$('chat-inbox-view').classList.add('hidden');$('create-group-chat-view').classList.remove('hidden');selectedGroupUsers.clear();renderSelectedGroup()}function closeCreateGroupChatView(){$('create-group-chat-view').classList.add('hidden');$('chat-inbox-view').classList.remove('hidden')}function renderSelectedGroup(){$('group-chat-selected-list').innerHTML=[...selectedGroupUsers.values()].map(u=>`<button onclick="selectedGroupUsers.delete('${u.uid}');renderSelectedGroup()" class="px-3 py-1 rounded-full bg-[var(--ink)] text-white text-xs">${escapeHtml(u.name)} ×</button>`).join('')}
async function searchUsersForGroupChat(q){let l=$('group-chat-search-results');q=(q||'').toLowerCase().trim();let users=(await ensureUsers()).filter(x=>x.normalizedName.includes(q)).slice(0,30);l.innerHTML=users.map(x=>`<button onclick="toggleGroupUser('${x.uid}')" class="w-full flex items-center gap-3 bg-white border border-[var(--line)] rounded-2xl p-3 text-left"><img src="${x.image}" class="w-10 h-10 rounded-full object-cover"><b>${escapeHtml(x.name)}</b></button>`).join('')}
async function createGroupChat(){let name=$('group-chat-name-input').value.trim()||'Grupo',me=auth.currentUser.uid,members=[me,...selectedGroupUsers.keys()];if(members.length<2){alert('Selecciona al menos una persona.');return;}let ref=db.ref('groupConversations').push(),id=ref.key,now=Date.now();await ref.set({name,createdBy:me,members:Object.fromEntries(members.map(x=>[x,true])),createdAt:now,updatedAt:now,lastMessage:'Grupo creado'});for(let uid of members)await db.ref('userConversations/'+uid+'/'+id).set({isGroup:true,groupName:name,updatedAt:now,lastMessage:'Grupo creado'});closeCreateGroupChatView();openGroupChatRoom(id)}
async function openGroupChatRoom(id){currentChatIsGroup=true;currentChatRoomId=id;let s=await db.ref('groupConversations/'+id).once('value'),g=s.val()||{};currentGroupMembers=Object.keys(g.members||{});$('chat-room-username').textContent=g.name||'Grupo';$('chat-room-user-image').classList.add('hidden');$('chat-room-group-avatar').classList.remove('hidden');showRoom();subscribeMessages();subscribeTyping();}
function openChatRoomInfo(){alert('Panel de información listo para rediseñar: perfil, miembros, archivos, silenciar, vaciar y temas del chat.')} 
</script>
