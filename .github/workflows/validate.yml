name: Validar código

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sintaxis de archivos JS
        run: |
          for f in drex-cloud.js server.js sw.js; do
            echo "== $f"
            node --check "$f"
          done

      - name: Sintaxis de scripts inline en index.html
        run: |
          python3 - <<'EOF'
          import re, subprocess, os
          s = open('index.html', encoding='utf-8').read()
          blocks = re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', s, re.S)
          os.makedirs('/tmp/jscheck', exist_ok=True)
          for i, b in enumerate(blocks):
              p = f'/tmp/jscheck/b{i:02d}.js'
              open(p, 'w', encoding='utf-8').write(b)
              r = subprocess.run(['node', '--check', p], capture_output=True, text=True)
              if r.returncode != 0:
                  print(f'ERROR de sintaxis en bloque inline #{i}:')
                  print(r.stderr[:800])
                  raise SystemExit(1)
          print(f'{len(blocks)} bloques inline OK')
          EOF

      - name: Prueba de humo de server.js
        run: |
          node server.js & SRV=$!
          sleep 1
          code() { curl -s -o /dev/null -w "%{http_code}" "http://localhost:5000$1"; }
          test "$(code /)" = "200"          || { echo "FAIL /"; exit 1; }
          test "$(code /server.js)" = "404"  || { echo "FAIL /server.js"; exit 1; }
          test "$(code /.replit)" = "404"    || { echo "FAIL /.replit"; exit 1; }
          test "$(code /%2e%2e/%2e%2e/etc/passwd)" = "403" || { echo "FAIL traversal"; exit 1; }
          test "$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:5000/api/x)" = "405" || { echo "FAIL POST"; exit 1; }
          kill $SRV
          echo "server.js OK"

  overlay-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cobertura del guard de la barra inferior
        run: python3 tools/check-overlay-guard.py

  inline-handlers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Handlers inline llaman funciones existentes
        run: python3 tools/check-onclick-handlers.py

  id-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Referencias a IDs existen en el DOM
        run: python3 tools/check-id-references.py

  ui-leftovers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sin TODO/FIXME ni textos de prueba en la UI
        run: python3 tools/check-ui-leftovers.py

      - name: Tests del propio check (tokenizer JS)
        run: python3 tools/test-check-ui-leftovers.py

  page-weight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Peso de index.html dentro del presupuesto
        run: python3 tools/check-page-weight.py

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests unitarios (node, sin dependencias)
        run: |
          for t in tests/test-*.js; do
            echo "== $t"
            node "$t" || exit 1
          done
          echo "todos los tests OK"

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: index.html y 404.html byte-idénticos
        run: |
          cmp index.html 404.html || { echo "FAIL: 404.html divergió de index.html (regenerar con: cp index.html 404.html)"; exit 1; }
          echo "paridad index/404 OK"
