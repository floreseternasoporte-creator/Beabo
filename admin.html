<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drex — Panel de Administración</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f2; color: #2f1a14; }
    #authScreen { display: flex; }
    #adminPanel { display: none; }
    #accessDenied { display: none; }
    .btn-primary { background: #3a241d; color: white; border-radius: 12px; padding: 10px 20px; font-weight: 600; font-size: 14px; transition: background 0.15s; }
    .btn-primary:hover { background: #5f3d35; }
    .btn-primary:disabled { background: #b2a7a1; cursor: not-allowed; }
    .btn-secondary { background: white; color: #3a241d; border: 1.5px solid #3a241d; border-radius: 12px; padding: 10px 20px; font-weight: 600; font-size: 14px; transition: all 0.15s; }
    .btn-secondary:hover { background: #f5f0ed; }
  </style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="authScreen" class="min-h-screen items-center justify-center bg-[#f5f4f2]">
  <div class="w-full max-w-sm mx-auto px-6">
    <div class="text-center mb-10">
      <div class="text-5xl font-black text-[#3a241d] mb-2">Drex</div>
      <div class="text-sm text-[#8a7a71] font-medium">Panel de administración</div>
    </div>
    <div class="bg-white rounded-3xl border border-[#e8e1dc] shadow-sm p-8">
      <p class="text-sm font-semibold text-[#2f1a14] mb-4">Inicia sesión con tu cuenta de admin</p>
      <input id="loginEmail" type="email" placeholder="Correo electrónico" class="w-full border border-[#e8e1dc] rounded-xl px-4 py-3 text-sm mb-3 bg-[#faf9f8]" />
      <input id="loginPassword" type="password" placeholder="Contraseña" class="w-full border border-[#e8e1dc] rounded-xl px-4 py-3 text-sm mb-4 bg-[#faf9f8]" />
      <div id="loginError" class="text-red-500 text-xs mb-3 hidden"></div>
      <button id="loginBtn" class="btn-primary w-full">Entrar</button>
    </div>
  </div>
</div>

<!-- ===== ACCESS DENIED ===== -->
<div id="accessDenied" class="min-h-screen items-center justify-center bg-[#f5f4f2]">
  <div class="text-center px-6">
    <div class="text-6xl mb-4">🔒</div>
    <h2 class="text-2xl font-bold text-[#3a241d] mb-2">Acceso denegado</h2>
    <p class="text-[#8a7a71] mb-2">Tu cuenta no tiene permisos de administrador.</p>
    <p id="deniedEmailDisplay" class="text-xs text-red-400 mb-6"></p>
    <button onclick="firebase.auth().signOut()" class="btn-secondary">Cerrar sesión</button>
  </div>
</div>

<!-- ===== ADMIN PANEL ===== -->
<div id="adminPanel" class="min-h-screen flex flex-col">

  <header class="bg-white border-b border-[#e8e1dc] px-6 py-4 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <div class="text-2xl font-black text-[#3a241d]">Drex</div>
      <span class="text-xs bg-[#3a241d] text-white px-2 py-0.5 rounded-full font-semibold">Admin</span>
    </div>
    <div class="flex items-center gap-3">
      <span id="adminEmailLabel" class="text-xs text-[#8a7a71] hidden md:block"></span>
      <button onclick="firebase.auth().signOut()" class="text-xs text-[#8a7a71] hover:text-[#3a241d] flex items-center gap-1.5 transition-colors">
        <i class="fas fa-sign-out-alt"></i> Salir
      </button>
    </div>
  </header>

  <div class="flex-1 flex flex-col items-center justify-center px-8 text-center">
    <i class="fas fa-tools text-5xl text-[#c5b8b1] mb-5"></i>
    <p class="text-[#2f1a14] font-bold text-xl mb-2">Panel en configuración</p>
    <p class="text-[#8a7a71] text-sm max-w-sm">Las nuevas integraciones de soporte están siendo configuradas. Este panel se actualizará próximamente.</p>
  </div>

</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyC9v2qp6zGtmvsFiOknlmTHnN6zZY1RLcI",
    authDomain: "ggggg-f2508.firebaseapp.com",
    databaseURL: "https://ggggg-f2508-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "ggggg-f2508",
    storageBucket: "ggggg-f2508.firebasestorage.app",
    messagingSenderId: "120837533638",
    appId: "1:120837533638:web:dab060eedf39a6d19f4cc7"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      show('authScreen'); hide('adminPanel'); hide('accessDenied');
      return;
    }
    const allowedEmails = ['zam.privacy@yahoo.com', 'zam.contact@yahoo.com'];
    const userEmail = (user.email || '').toLowerCase().trim();
    const isAdminEmail = allowedEmails.includes(userEmail);
    const adminSnap = await db.ref('admins/' + user.uid).once('value');
    const hasAdminDbAccess = adminSnap.exists() && adminSnap.val();
    if (!isAdminEmail && !hasAdminDbAccess) {
      document.getElementById('deniedEmailDisplay').textContent = 'Correo detectado: ' + (user.email || 'No detectado');
      hide('authScreen'); hide('adminPanel'); show('accessDenied');
      return;
    }
    document.getElementById('adminEmailLabel').textContent = user.email;
    hide('authScreen'); hide('accessDenied'); show('adminPanel');
  });

  document.getElementById('loginBtn').addEventListener('click', () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pw = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.classList.add('hidden');
    if (!email || !pw) { showLoginError('Ingresa tu correo y contraseña.'); return; }
    document.getElementById('loginBtn').disabled = true;
    document.getElementById('loginBtn').textContent = 'Entrando…';
    auth.signInWithEmailAndPassword(email, pw).catch(() => {
      showLoginError('Credenciales incorrectas. Verifica tu correo y contraseña.');
      document.getElementById('loginBtn').disabled = false;
      document.getElementById('loginBtn').textContent = 'Entrar';
    });
  });

  document.getElementById('loginPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  function showLoginError(msg) {
    const el = document.getElementById('loginError');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function show(id) {
    const el = document.getElementById(id);
    el.style.display = 'flex';
    el.style.flexDirection = el.id === 'adminPanel' ? 'column' : '';
  }
  function hide(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
